<section id="rackLab" hidden aria-label="POST rack preparation">
  <div class="toolbar"><button id="rackUndo">되돌리기</button><button id="rackRedo">다시 하기</button><button id="rackExport">랙 저장 .crlab</button><label class="file-button">랙 불러오기<input id="rackImport" type="file" accept=".crlab,application/json" hidden></label></div>
  <div class="rack-heading"><div><span class="rack-kicker">POST / CONTROL STUDY</span><h2>랙별 원본 조절부</h2><p>컴프레서 · 프리앰프 · EQ — 모델별 설정을 독립 보관합니다.</p></div><span class="rack-meter">METER · 신호 없음</span></div>
  <div class="rack-selectors"><label>구획<select id="rackSection"><option value="bus">COMPRESSOR</option><option value="preamp">PREAMP</option><option value="eq">EQ</option></select></label><label>모델<select id="rackModel"></select></label><label><input id="rackBypass" type="checkbox"> BYPASS</label></div>
  <article class="rack-chassis"><div class="rack-title"><div><h3 id="rackName"></h3><p id="rackReference"></p></div><span id="rackReview"></span></div><div id="rackControls"></div></article>
  <div class="rack-utility"><strong>CHIMERA LEVEL</strong><label>Input Trim <input id="rackInputTrim" type="number" min="-24" max="24" step="0.1"> dB</label><label>Output Level <input id="rackOutputLevel" type="number" min="-24" max="24" step="0.1"> dB</label></div>
  <p id="rackNote" class="rack-note"></p><details class="rack-details"><summary>자료와 구현 범위</summary><p id="rackOmitted"></p><div id="rackSources"></div><p>준비용 무음 상태 뷰입니다. DSP·실물 반응·DAW 자동화는 연결되지 않았습니다. 연속 값은 노브 위치이며 하드웨어 단위나 출고값을 보증하지 않습니다. MOD/DELAY/REVERB 12종은 원본 패널 검토 대기입니다.</p></details>
  <p id="rackMessage" role="status" aria-live="polite"></p>
</section>
