name: OBS 32.2.2 Windows hang repro (temporary)
# Temporary investigation: once, OBS 32.2.2 on Windows stopped answering
# obs-websocket right after "Created scene collection" and then would not quit
# (obs-addon run 41342999051, attempt 1, right after obs_instances_test on
# 31.1.2). Repeat that sequence and the 32.2.2 app test alone, keeping every
# run's screen, window text and logs. Not a gate.
on:
  push:
    branches: [claude/quirky-fermi-b0k2ck]
    paths: ['.github/workflows/obs32-hang-repro.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Chimera VST3 under test
        run: |
          cmake -S . -B build -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
          cmake --build build --config Release --target ChimeraAmpMatrix_VST3 --parallel 4
      - name: Build the OBS module against OBS 31.1.2 (MSVC)
        shell: pwsh
        # -TestBundle also builds (and runs) the module's tests, chimera-obs-state-tool among them.
        run: |
          ./OBS/tools/Build-WindowsModule.ps1 -OutputDirectory package/chimera-obs `
            -TestBundle "build/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3" `
            -WorkDirectory "$env:RUNNER_TEMP/chimera-obs"
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP "chimera-obs/build/Release/chimera-obs-state-tool.exe"))) { throw "no state tool" }
      - name: OBS 31.1.2 and 32.2.2
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "chimera-obs/obs-31.1.2.zip") -DestinationPath (Join-Path $env:RUNNER_TEMP "obs31")
          $zip = Join-Path $env:RUNNER_TEMP "obs-32.2.2.zip"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1") { throw "OBS 32.2.2 release hash mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "obs32")
          python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Repeat instances test (31.1.2) then app test (32.2.2), then the 32.2.2 app test alone
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $vst3 = "$PWD/build/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3"
          $tool = Join-Path $env:RUNNER_TEMP "chimera-obs/build/Release/chimera-obs-state-tool.exe"
          $obs31 = Join-Path $env:RUNNER_TEMP "obs31/bin/64bit/obs64.exe"
          $obs32 = Join-Path $env:RUNNER_TEMP "obs32/bin/64bit/obs64.exe"
          $out = Join-Path $env:RUNNER_TEMP "repro"
          $results = @()
          function Run-One($label, $script, $obs) {
            $work = Join-Path $out $label
            $started = Get-Date
            New-Item -ItemType Directory -Force $out | Out-Null
            $log = Join-Path $out "$label.txt"
            python $script --obs $obs --module package/chimera-obs --vst3 $vst3 --state-tool $tool --ffmpeg $ffmpeg --work $work *> $log
            $code = $LASTEXITCODE
            $seconds = [int]((Get-Date) - $started).TotalSeconds
            if ($code -ne 0) {
              # A failed run leaves OBS's configuration and the plugin behind; keep them, then clear for the next run.
              # Name what OBS left running (the last hang repeated in every later run), then end it all.
              Get-Process | Where-Object { $_.ProcessName -match '^obs' } | ForEach-Object { Write-Host ("    left running: {0} {1}" -f $_.ProcessName, $_.Id) }
              Get-Process | Where-Object { $_.ProcessName -match '^obs' } | Stop-Process -Force
              Start-Sleep 2
              $config = Join-Path $env:APPDATA "obs-studio"
              if (Test-Path $config) { Copy-Item -Recurse $config (Join-Path $work "appdata-obs-studio") -ErrorAction SilentlyContinue; Remove-Item -Recurse -Force $config -ErrorAction SilentlyContinue }
              Remove-Item -Recurse -Force (Join-Path $env:ProgramData "obs-studio/plugins/chimera-obs") -ErrorAction SilentlyContinue
            }
            $left = (Get-Process | Where-Object { $_.ProcessName -match '^obs' } | ForEach-Object { $_.ProcessName }) -join ','
            $line = "{0,-22} exit {1}  {2,4} s  obs processes after: {3}" -f $label, $code, $seconds, $(if ($left) { $left } else { 'none' })
            Write-Host $line
            if ($code -ne 0) {
              # Artifacts may not be reachable from where this is read: print the run's own report.
              Get-Content $log | Select-String -NotMatch "^(info|debug|warning): " | Select-Object -Last 120 | ForEach-Object { Write-Host "    | $_" }
            }
            return $line
          }
          for ($i = 1; $i -le 0; $i++) {
            $results += Run-One "pair$i-instances31" "OBS/tests/obs_instances_test.py" $obs31
            $results += Run-One "pair$i-app32" "OBS/tests/obs_app_test.py" $obs32
          }
          for ($i = 1; $i -le 16; $i++) {
            $results += Run-One "alone$i-app32" "OBS/tests/obs_app_test.py" $obs32
          }
          Write-Host "`n=== summary"
          $results | ForEach-Object { Write-Host $_ }
          $results | Out-File (Join-Path $out "summary.txt")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs32-hang-repro
          path: ${{ runner.temp }}/repro/
          if-no-files-found: ignore
