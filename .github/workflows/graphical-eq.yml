name: Graphical EQ prototype contracts
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'Tools/eq_attribution_provenance.py'
      - 'CMakeLists.txt'
      - '.github/workflows/graphical-eq.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphical-eq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  graphical-eq:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - run: cmake -S . -B build-eq -DCMAKE_BUILD_TYPE=Release -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - run: cmake --build build-eq --config Release --target ChimeraGraphicalEQTests ChimeraGraphicalEQUITests ChimeraGraphicalEQEditingTests ChimeraEQSnapshotFreezeTests ChimeraEQAnalyzerTests ChimeraEQAnalyzerPerformanceTests ChimeraGateProcessorTests ChimeraCommonDynamicsTests ChimeraAutoSetTests ChimeraMultibandDynamicsTests ChimeraMultibandDynamicsCoreTests --parallel 2
      - name: Record source and runner provenance
        run: python3 Tools/eq_attribution_provenance.py build-eq
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-eq -C Release -R "^(ChimeraGraphicalEQ.*Tests|ChimeraEQSnapshotFreezeTests|ChimeraEQAnalyzer.*Tests|ChimeraEQHighRateAttributionTests|ChimeraGateProcessorTests|ChimeraCommonDynamicsTests|ChimeraAutoSetTests|ChimeraMultibandDynamics(Core)?Tests)$" --output-on-failure --no-tests=error --output-junit eq-results.xml
      - if: runner.os == 'Linux'
        run: python3 Tools/run_linux_ui_tests.py -- ctest --test-dir build-eq -C Release -R "^(ChimeraGraphicalEQ.*Tests|ChimeraEQSnapshotFreezeTests|ChimeraEQAnalyzer.*Tests|ChimeraEQHighRateAttributionTests|ChimeraGateProcessorTests|ChimeraCommonDynamicsTests|ChimeraAutoSetTests|ChimeraMultibandDynamics(Core)?Tests)$" --output-on-failure --no-tests=error --output-junit eq-results.xml
      - if: runner.os == 'Windows'
        run: cmake --build build-eq --config Release --target ChimeraAmpMatrix_Standalone --parallel 2
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: EQ-development-standalone-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-eq/ChimeraAmpMatrix_artefacts/Release/Standalone/SpectralForge Chimera.exe
            build-eq/chimera-build-version.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EQ-contracts-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-eq/Testing/Temporary/LastTest.log
            build-eq/eq-results.xml
            build-eq/chimera-build-version.json
            build-eq/eq-cpu.csv
            build-eq/eq-analyzer-*.csv
            build-eq/eq-attribution/**
            build-eq/eq-attribution-provenance.json
            build-eq/eq-ui-*.png
            build-eq/eq-live-*.png
          if-no-files-found: error
