name: Verify and publish factory preset maintenance
on:
  pull_request:
    paths:
      - Source/**
      - Tests/**
      - Tools/**
      - CMakeLists.txt
      - Validation/**
      - docs/**
      - evidence/preset-dynamics-eq-20261019/**
      - .github/workflows/**
  push:
    branches: [main]
    paths: [Validation/preset-maintenance-policy.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: chimera-preset-maintenance-${{ github.event.pull_request.number || 'publication' }}
  cancel-in-progress: false
jobs:
  contracts:
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retain publisher, installer and evidence contracts
        run: |
          python Tools/check_ir_distribution.py
          python Tests/test_ir_distribution.py
          python Tools/test_publish_beta131.py
          python Tools/test_beta_publication131.py
          python Tools/test_publish_release.py
          python Tools/test_weekly_publication.py
          python Tools/test_publication_evidence.py
          python Tests/test_packaging_version.py
          python Tools/test_preset_maintenance.py
      - name: Verify preset scope against the published beta.1 source
        run: python Tools/publish_preset_maintenance.py --check-source
  publish:
    needs: contracts
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read exact tested-source maintenance receipt
        id: receipt
        run: python Tools/publish_preset_maintenance.py --approval-state
      - name: Wait for all seven exact-source workflows and publish verified packages
        if: steps.receipt.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/publish_preset_maintenance.py --publish --wait-ci-seconds 5400
