name: Niflheimr DI audition contracts
on:
  pull_request:
    paths:
      - 'Tests/RenderNiflheimr*.cpp'
      - 'Tests/test_niflheimr_audition.py'
      - 'Tools/audition_niflheimr.py'
      - 'Validation/audition/**'
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/niflheimr-audition.yml'
permissions:
  contents: read
concurrency:
  group: niflheimr-audition-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audition-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build-audition -DCMAKE_BUILD_TYPE=Release -DCHIMERA_ENABLE_NIFLHEIMR_MEASUREMENTS=ON
      - run: cmake --build build-audition --config Release --target ChimeraNiflheimrRender ChimeraNiflheimrRigRender --parallel 2
      - name: Synthetic tool contracts (musical acceptance remains pending)
        run: ctest --test-dir build-audition -C Release -R "ChimeraNiflheimr(Audition|Renderer).*Tests" --output-on-failure --no-tests=error
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Niflheimr-audition-contracts-${{ runner.os }}-${{ github.event.pull_request.head.sha }}
          path: |
            build-audition/audition-route-evidence
            build-audition/Testing/Temporary/LastTest.log
            build-audition/ChimeraNiflheimrRender_artefacts/Release/*
            build-audition/ChimeraNiflheimrRigRender_artefacts/Release/*
          if-no-files-found: error
