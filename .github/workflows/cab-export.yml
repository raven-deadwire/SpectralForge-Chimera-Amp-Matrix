name: Cabinet WAV round trip
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/CabExportTests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/cab-export.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cab-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  round-trip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb
      - name: Configure native CAB test (not a distributable build)
        run: cmake -S . -B build-cab-export -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      # Run this target before the expensive all-product/all-test build. A
      # timeout in an unrelated target cannot hide CAB regression results.
      - name: Build CAB regression target
        run: cmake --build build-cab-export --config Release --target ChimeraCabExportTests --parallel 2
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-cab-export -C Release -R '^ChimeraCabExportTests$' --output-on-failure --no-tests=error --output-junit cab-export-results.xml
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-cab-export -C Release -R '^ChimeraCabExportTests$' --output-on-failure --no-tests=error --output-junit cab-export-results.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cab-export-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-cab-export/Testing/Temporary/LastTest.log
            build-cab-export/cab-export-results.xml
          if-no-files-found: warn
