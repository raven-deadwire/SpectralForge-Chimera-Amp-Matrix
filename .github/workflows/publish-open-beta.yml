name: Publish verified Open Beta 1.0

on:
  push:
    branches: [release/open-beta-1]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-chimera-v1.0.0-beta.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix' && github.ref == 'refs/heads/release/open-beta-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify immutable build 136, stage assets, and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/publish_open_beta.py
