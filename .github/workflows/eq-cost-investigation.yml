name: EQ cost investigation (no device acceptance)
on:
  pull_request:
    paths:
      - 'Tests/EQAnalyzerCostInvestigation.cpp'
      - 'Tests/analyze_eq_cost_investigation.py'
      - 'Tools/run_eq_cost_investigation.py'
      - '.github/workflows/eq-cost-investigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build-cost -DCMAKE_BUILD_TYPE=Release -DCHIMERA_EQ_DEVELOPMENT_PREVIEW=ON
      - run: cmake --build build-cost --config Release --target ChimeraEQAnalyzerCostInvestigation --parallel 2
      - run: python3 Tools/run_eq_cost_investigation.py build-cost
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EQ-cost-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-cost/eq-cost-investigation/**
            build-cost/chimera-build-version.json
            build-cost/CMakeCache.txt
          if-no-files-found: error
