name: Beta lifecycle and state preservation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generator, publisher and prior release compatibility
        shell: bash
        run: |
          python Tools/test_beta_lifecycle.py
          python Tools/test_publish_release.py
          python Tools/test_weekly_publication.py
          python Tools/test_publication_evidence.py
          python Tests/test_packaging_version.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Configure marked qualification build (no approved deadline)
        run: cmake -S . -B build-beta -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - name: Build real processor, serializer, editor and updater regressions
        run: cmake --build build-beta --config Release --target ChimeraBetaLifecycleTests ChimeraBetaLifecycleProcessorTests ChimeraUITests ChimeraReleaseTests ChimeraGateProcessorTests --parallel 2
      - if: runner.os != 'Linux'
        name: Runtime and state tests
        run: ctest --test-dir build-beta -C Release -R '^(ChimeraBetaLifecycle.*Tests|ChimeraNativeStateTests|ChimeraReleaseTests|ChimeraGateProcessorTests)$' --output-on-failure --no-tests=error --output-junit beta-results.xml
      - if: runner.os == 'Linux'
        name: Runtime and state tests with supervised display
        run: python Tools/run_linux_ui_tests.py -- ctest --test-dir build-beta -C Release -R '^(ChimeraBetaLifecycle.*Tests|ChimeraNativeStateTests|ChimeraReleaseTests|ChimeraGateProcessorTests)$' --output-on-failure --no-tests=error --output-junit beta-results.xml
      - if: runner.os == 'macOS'
        name: Repeat macOS native state restoration without retrying failures
        run: ctest --test-dir build-beta -C Release -R '^ChimeraNativeStateTests$' --repeat until-fail:5 --output-on-failure --no-tests=error --output-junit macos-state-repeat.xml
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Beta-lifecycle-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-beta/*results.xml
            build-beta/macos-state-repeat.xml
            build-beta/beta-lifecycle-evidence/
            build-beta/native-state/
            build-beta/chimera-build-version.json
            build-beta/chimera-beta-lifecycle.json
            build-beta/Testing/Temporary/LastTest.log
          if-no-files-found: error
