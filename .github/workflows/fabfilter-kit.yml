name: FabFilter black-box kit (no release)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Tools/fabfilter_kit.py'
      - 'Tools/test_fabfilter_kit.py'
      - 'Tools/FabFilterKit/**'
      - 'Source/GraphicalEQ.h'
      - 'Source/CommonDynamics.h'
      - '.github/workflows/fabfilter-kit.yml'
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 matplotlib
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build-kit -DCMAKE_BUILD_TYPE=Release -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - run: cmake --build build-kit --config Release --target ChimeraKitProbe --parallel 2
      - name: Analyzer self-test and Chimera probe
        run: CHIMERA_KIT_PROBE="$PWD/build-kit/ChimeraKitProbe_artefacts/Release/ChimeraKitProbe" python Tools/test_fabfilter_kit.py -v
      - name: Chimera baseline measurements (no FabFilter reference)
        run: |
          python Tools/fabfilter_kit.py generate --out /tmp/kit
          python Tools/fabfilter_kit.py chimera --kit /tmp/kit --probe build-kit/ChimeraKitProbe_artefacts/Release/ChimeraKitProbe --out /tmp/kit-chimera
          python Tools/fabfilter_kit.py analyze --kit /tmp/kit --renders /tmp/kit-chimera --out /tmp/kit-chimera.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FabFilter-kit-Chimera-baseline-not-release
          path: |
            /tmp/kit/manifest.json
            /tmp/kit/RENDER_GUIDE.md
            /tmp/kit-chimera.json
