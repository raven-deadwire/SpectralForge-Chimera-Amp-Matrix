name: OBS add-on
# GPL OBS module that hosts the installed Chimera VST3 (Issue #131). Each job
# builds the product VST3 from this commit, then the module, and runs the
# integration tests through libobs. Passing CI is not an OBS Studio UI,
# editor, broadcast or long-session acceptance; see OBS/README.md.
on:
  pull_request:
    paths:
      - 'OBS/**'
      - '.github/workflows/obs-addon.yml'
  push:
    branches: [main]
    paths:
      - 'OBS/**'
      - '.github/workflows/obs-addon.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Windows target: the official release, pinned by hash. The module links an
  # import library generated from this obs.dll and is tested against it.
  OBS_WINDOWS_VERSION: '31.1.2'
  OBS_WINDOWS_ZIP_SHA256: '9513cd402936593a6a5500da5d2bd49e6cd04dce05509c7b7f48dd25c391d2d8'
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install JUCE, libobs (Ubuntu 30.0.2) and display dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libobs-dev xvfb
      - name: Build the Chimera VST3 under test
        run: |
          cmake -S . -B build -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ChimeraAmpMatrix_VST3 --parallel 4
      - name: Build the OBS module and tests
        run: |
          cmake -S OBS -B build-obs -DCMAKE_BUILD_TYPE=Release -DCHIMERA_OBS_TEST_BUNDLE="$PWD/build/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3"
          cmake --build build-obs --parallel 4
      - name: Bridge, host and headless libobs filter tests
        # libobs on Linux opens an X display even for audio-only use.
        run: xvfb-run -a ctest --test-dir build-obs --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-obs-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-obs/chimera-obs.so
            build-obs/data/
            OBS/LICENSE
            OBS/README.md
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Chimera VST3 under test
        run: |
          cmake -S . -B build -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
          cmake --build build --config Release --target ChimeraAmpMatrix_VST3 --parallel 4
      - name: Fetch the pinned OBS release and its libobs headers
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\obs.zip"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_WINDOWS_VERSION/OBS-Studio-$env:OBS_WINDOWS_VERSION-Windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:OBS_WINDOWS_ZIP_SHA256) { throw "OBS release hash mismatch: $hash" }
          python -I -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); [z.extract(n, sys.argv[2]) for n in z.namelist() if n.startswith(('bin/64bit/', 'data/libobs/'))]" $zip "$env:RUNNER_TEMP\obs"
          git clone --depth 1 --branch $env:OBS_WINDOWS_VERSION --filter=blob:none --sparse https://github.com/obsproject/obs-studio "$env:RUNNER_TEMP\obs-src"
          git -C "$env:RUNNER_TEMP\obs-src" sparse-checkout set libobs
      - name: Generate obs.lib from the release obs.dll
        shell: pwsh
        run: |
          python -I OBS/tools/dll_exports_def.py "$env:RUNNER_TEMP\obs\bin\64bit\obs.dll" "$env:RUNNER_TEMP\obs.def"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $lib = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe' | Select-Object -First 1
          if (-not $lib) { throw 'lib.exe not found' }
          & $lib /nologo "/def:$env:RUNNER_TEMP\obs.def" /machine:x64 "/out:$env:RUNNER_TEMP\obs.lib"
          if ($LASTEXITCODE) { throw "lib.exe failed: $LASTEXITCODE" }
      - name: Build the OBS module and tests (MSVC)
        shell: pwsh
        run: |
          cmake -S OBS -B build-obs -A x64 `
            "-DCHIMERA_OBS_LIBOBS_INCLUDE_DIR=$env:RUNNER_TEMP\obs-src\libobs" `
            "-DCHIMERA_OBS_LIBOBS_LIBRARY=$env:RUNNER_TEMP\obs.lib" `
            "-DCHIMERA_OBS_TEST_BUNDLE=$PWD\build\ChimeraAmpMatrix_artefacts\Release\VST3\SpectralForge Chimera.vst3"
          cmake --build build-obs --config Release --parallel 4
      - name: Bridge, host and libobs filter tests against the OBS release
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\obs\bin\64bit;$env:PATH"
          ctest --test-dir build-obs -C Release --output-on-failure --no-tests=error
      - name: Lay out the plugin as OBS loads it from ProgramData
        shell: pwsh
        run: |
          $root = 'package\chimera-obs'
          New-Item -ItemType Directory -Force "$root\bin\64bit" | Out-Null
          Copy-Item build-obs\Release\chimera-obs.dll "$root\bin\64bit\"
          Copy-Item -Recurse OBS\data "$root\data"
          Copy-Item OBS\LICENSE, OBS\README.md package\
      - uses: actions/upload-artifact@v4
        with:
          name: chimera-obs-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: package/
          if-no-files-found: error

  bridge:
    # The realtime boundary has no libobs/VST3 dependency; macOS module
    # packaging is plan stage F.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          cmake -S OBS -B build-obs -DCHIMERA_OBS_BUILD_MODULE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-obs --parallel 3
          ctest --test-dir build-obs --output-on-failure --no-tests=error
