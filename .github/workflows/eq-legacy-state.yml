name: EQ released beta.2 state compatibility
on:
  pull_request:
    paths:
      - 'Tests/EQLegacyStateTests.cpp'
      - 'Tests/EQNormalization*'
      - 'Tests/test_eq_normalization_render.py'
      - 'Tools/eq_normalization_render.py'
      - 'Tests/test_eq_legacy_fixture.py'
      - 'Tests/VST3EQStateHost.cpp'
      - 'Tests/fixtures/eq-beta2/**'
      - 'Tools/eq_legacy_fixture.py'
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/eq-legacy-state.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eq-legacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Verify immutable released fixture provenance
        run: python3 Tools/eq_legacy_fixture.py verify --output Tests/fixtures/eq-beta2
      - run: cmake -S . -B build-legacy -DCMAKE_BUILD_TYPE=Release -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - id: build_contracts
        run: cmake --build build-legacy --config Release --target ChimeraEQLegacyStateTests ChimeraEQNormalizationTests ChimeraGraphicalEQEditingTests ChimeraEQSnapshotFreezeTests --parallel 2
      - name: Existing synthetic contracts and real binary fixture contracts
        run: ctest --test-dir build-legacy -C Release -R "^(ChimeraEQLegacyStateTests|ChimeraEQLegacyFixtureIntegrity|ChimeraEQLegacyEvidenceTests|ChimeraEQNormalizationTests|ChimeraEQNormalizationEvidenceTests|ChimeraEQTunerParameterContractTests|ChimeraGraphicalEQEditingTests|ChimeraEQSnapshotFreezeTests)$" --output-on-failure --no-tests=error --output-junit legacy-results.xml
      - if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_contracts.outcome == 'success' }}
        run: cmake --build build-legacy --config Release --target ChimeraVST3EQStateHost ChimeraAmpMatrix_VST3 --parallel 2
      - name: Download and capture the unchanged public beta.2 binary
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_contracts.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build-legacy/released
          curl --fail --location --retry 3 -o build-legacy/released/beta2.deb https://github.com/raven-deadwire/SpectralForge-Chimera-Amp-Matrix/releases/download/v1.3.1-beta.2/SpectralForge-Chimera-1.3.1-beta.2-linux-x86_64.deb
          echo '5f7b98efbae81715b40bc572ae6bbaf02ad40ea1f91163110a9ed6469823a7ab  build-legacy/released/beta2.deb' | sha256sum -c -
          dpkg-deb -x build-legacy/released/beta2.deb build-legacy/released/root
          python3 Tools/eq_legacy_fixture.py capture --package build-legacy/released/beta2.deb --binary 'build-legacy/released/root/usr/lib/vst3/SpectralForge Chimera.vst3/Contents/x86_64-linux/SpectralForge Chimera.so' --host build-legacy/ChimeraVST3EQStateHost --output build-legacy/live-capture
          build-legacy/ChimeraEQLegacyStateTests_artefacts/Release/ChimeraEQLegacyStateTests "$PWD/build-legacy/live-capture" "$PWD/build-legacy/live-roundtrip"
      - name: Replay old numeric VST3 automation IDs and reopen with the old binary
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_contracts.outcome == 'success' }}
        shell: bash
        run: |
          build-legacy/ChimeraVST3EQStateHost "$PWD/build-legacy/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3/Contents/x86_64-linux/SpectralForge Chimera.so" build-legacy/abi-replay replay "$PWD/build-legacy/live-roundtrip/ab-seeded/reused.chimera" "$PWD/build-legacy/live-capture/lanes.tsv"
          python3 Tools/eq_legacy_fixture.py compare --expected build-legacy/live-capture --actual build-legacy/abi-replay --before build-legacy/live-roundtrip/ab-seeded/reused.chimera --automated build-legacy/live-roundtrip/ab-seeded/automated.chimera
          for phase in deleted reused automated; do
            build-legacy/ChimeraVST3EQStateHost "$PWD/build-legacy/released/root/usr/lib/vst3/SpectralForge Chimera.vst3/Contents/x86_64-linux/SpectralForge Chimera.so" "build-legacy/old-reopened-$phase" default "$PWD/build-legacy/live-roundtrip/ab-seeded/$phase.chimera"
            python3 Tools/eq_legacy_fixture.py roundtrip --before "build-legacy/live-roundtrip/ab-seeded/$phase.chimera" --after "build-legacy/old-reopened-$phase/component.bin"
          done
      - name: Exact canonical-state renders through released and candidate VST3
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_contracts.outcome == 'success' }}
        shell: bash
        run: |
          python3 Tools/eq_normalization_render.py --host build-legacy/ChimeraVST3EQStateHost --released 'build-legacy/released/root/usr/lib/vst3/SpectralForge Chimera.vst3/Contents/x86_64-linux/SpectralForge Chimera.so' --candidate 'build-legacy/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3/Contents/x86_64-linux/SpectralForge Chimera.so' --states build-legacy/eq-legacy --lanes Tests/fixtures/eq-beta2/lanes.tsv --output build-legacy/normalization-render
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EQ-legacy-state-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-legacy/Testing/Temporary/LastTest.log
            build-legacy/legacy-results.xml
            build-legacy/chimera-build-version.json
            build-legacy/eq-legacy/**
            build-legacy/live-capture/**
            build-legacy/live-roundtrip/**
            build-legacy/abi-replay/**
            build-legacy/old-reopened-*/**
            build-legacy/normalization-render/**
          if-no-files-found: error
