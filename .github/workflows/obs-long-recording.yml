name: OBS long recording
# Plan stage D: an hour recorded through the Chimera OBS filter in the real
# OBS Studio app (Ubuntu 30.0.2 under Xvfb), with the filter's realtime log
# lines, start/end audio/video sync and OBS's own statistics. It takes over an
# hour, so it runs on request and when the test itself changes, not on every
# OBS change (obs-addon.yml covers those). See OBS/README.md.
on:
  pull_request:
    paths:
      - 'OBS/tests/obs_long_record_test.py'
      - '.github/workflows/obs-long-recording.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Recording length in minutes (61: the hour plus a margin)'
        default: '61'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install JUCE, libobs and OBS Studio (Ubuntu 30.0.2) and display dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libobs-dev libglib2.0-dev pkg-config xvfb obs-studio ffmpeg
      - name: Build the Chimera VST3 under test
        run: |
          cmake -S . -B build -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ChimeraAmpMatrix_VST3 --parallel 4
      - name: Build and stage the OBS module
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          cmake -S OBS -B build-obs -DCMAKE_BUILD_TYPE=Release -DCHIMERA_OBS_SOURCE_SHA="$sha"
          cmake --build build-obs --parallel 4
          python3 OBS/tools/stage_module.py linux --build build-obs --output package --source-sha "$sha" --built-for "OBS 30.0.2 (Ubuntu 24.04 libobs)"
      - name: Real OBS Studio app - record an hour through the Chimera filter
        run: |
          xvfb-run -a python3 OBS/tests/obs_long_record_test.py --module package/chimera-obs \
            --vst3 "$PWD/build/ChimeraAmpMatrix_artefacts/Release/VST3/SpectralForge Chimera.vst3" \
            --work "$RUNNER_TEMP/obs-long" --minutes "${{ github.event.inputs.minutes || '61' }}"
      - name: Keep the summary and the OBS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-long-recording-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/obs-long/long-record-summary.json
            ${{ runner.temp }}/obs-long/obs-run.txt
            ${{ runner.temp }}/obs-long/obs-logs/
            ${{ runner.temp }}/obs-long/home/.config/obs-studio/logs/
          if-no-files-found: ignore
