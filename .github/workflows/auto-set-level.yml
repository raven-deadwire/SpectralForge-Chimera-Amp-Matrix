name: Auto Set level and reference loudness
# PROBE BRANCH ONLY (never merged): builds ChimeraAutoSetTests on Windows in several variants to find
# why the compiler dies (cl D8040) from phase 29 on.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: control, cl: "", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
          - {name: alone, cl: "", append: "", parallel: 1, targets: "ChimeraAutoSetTests"}
          - {name: alone-mp1, cl: "", append: "/MP1", parallel: 1, targets: "ChimeraAutoSetTests"}
          - {name: no-lane-ir-tests, cl: "/DCHIMERA_PROBE_NO_LANE_IR_TESTS", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
          - {name: no-lane-ir-controller, cl: "/DCHIMERA_PROBE_NO_LANE_IR_CONTROLLER", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
          - {name: no-lane-ir-rules, cl: "/DCHIMERA_PROBE_NO_LANE_IR_RULES", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
          - {name: bigobj, cl: "/bigobj", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
    name: probe (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CL: ${{ matrix.cl }}
      _CL_: ${{ matrix.append }}
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build-level -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCHIMERA_LOUDNESS_REFERENCE_TESTS=OFF
      - shell: pwsh
        run: |
          $sw=[Diagnostics.Stopwatch]::StartNew()
          cmake --build build-level --config Release --target ${{ matrix.targets }} --parallel ${{ matrix.parallel }} -- /v:minimal /clp:Summary
          $code=$LASTEXITCODE
          "PROBE ${{ matrix.name }}: build exit $code after $([int]$sw.Elapsed.TotalSeconds) s"
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { "PROBE memory: total $([int]($_.TotalVisibleMemorySize/1MB)) GB, free $([int]($_.FreePhysicalMemory/1MB)) GB, commit limit $([int]($_.TotalVirtualMemorySize/1MB)) GB" }
          Get-CimInstance Win32_LogicalDisk | ForEach-Object { "PROBE disk $($_.DeviceID): free $([int]($_.FreeSpace/1GB)) GB" }
          exit $code
