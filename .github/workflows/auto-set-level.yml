name: Auto Set level and reference loudness
# PROBE BRANCH ONLY (never merged): builds ChimeraAutoSetTests on Windows in several variants to find
# why the compiler dies (cl D8040) from phase 29 on.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: rewritten, cl: "", append: "", parallel: 2, targets: "ChimeraAutoSetTests ChimeraAutoSetBusOrderDSPTests ChimeraAutoSetInstrumentTests"}
          - {name: keep-setall, cl: "/DCHIMERA_PROBE_KEEP_SETALL", append: "", parallel: 1, targets: "ChimeraAutoSetTests"}
          - {name: keep-with, cl: "/DCHIMERA_PROBE_KEEP_WITH", append: "", parallel: 1, targets: "ChimeraAutoSetTests"}
          - {name: keep-reason, cl: "/DCHIMERA_PROBE_KEEP_REASON", append: "", parallel: 1, targets: "ChimeraAutoSetTests"}
          - {name: keep-all, cl: "/DCHIMERA_PROBE_KEEP_SETALL /DCHIMERA_PROBE_KEEP_WITH /DCHIMERA_PROBE_KEEP_REASON", append: "", parallel: 1, targets: "ChimeraAutoSetTests"}
    name: probe (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CL: ${{ matrix.cl }}
      _CL_: ${{ matrix.append }}
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build-level -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCHIMERA_LOUDNESS_REFERENCE_TESTS=OFF
      - shell: pwsh
        run: |
          $sw=[Diagnostics.Stopwatch]::StartNew()
          cmake --build build-level --config Release --target ${{ matrix.targets }} --parallel ${{ matrix.parallel }} -- /v:minimal /clp:Summary 2>&1 | Tee-Object -FilePath build.log
          $code=$LASTEXITCODE
          "PROBE ${{ matrix.name }}: build exit $code after $([int]$sw.Elapsed.TotalSeconds) s"
          if(Test-Path build.log){ Select-String -Path build.log -Pattern "D8040|MSB6006|error C|fatal error" | Select-Object -First 5 | ForEach-Object { "PROBE error: $($_.Line)" } }
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { "PROBE memory: total $([int]($_.TotalVisibleMemorySize/1MB)) GB, free $([int]($_.FreePhysicalMemory/1MB)) GB, commit limit $([int]($_.TotalVirtualMemorySize/1MB)) GB" }
          Get-CimInstance Win32_LogicalDisk | ForEach-Object { "PROBE disk $($_.DeviceID): free $([int]($_.FreeSpace/1GB)) GB" }
          exit $code
