name: Auto Set level and reference loudness
on:
  pull_request:
    paths:
      - 'Source/AutoSet*.h'
      - 'Source/PluginProcessor.*'
      - 'Source/GraphicalEQ.h'
      - 'Tests/AutoSet*'
      - 'CMakeLists.txt'
      - '.github/workflows/auto-set-level.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auto-set-level-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  auto-set:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libebur128-dev libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb
      - run: cmake -S . -B build-level -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCHIMERA_LOUDNESS_REFERENCE_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - run: cmake --build build-level --config Release --target ChimeraAutoSetTests --parallel 2
      - if: runner.os == 'Linux'
        run: cmake --build build-level --config Release --target ChimeraAutoSetLoudnessReferenceTests --parallel 2
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-level -C Release -R '^ChimeraAutoSet(Tests|LoudnessReferenceTests)$' --output-on-failure --no-tests=error --output-junit auto-set-results.xml
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-level -C Release -R '^ChimeraAutoSetTests$' --output-on-failure --no-tests=error --output-junit auto-set-results.xml
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AutoSet-Level-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-level/auto-set-results.xml
            build-level/Testing/Temporary/LastTest.log
          if-no-files-found: warn
