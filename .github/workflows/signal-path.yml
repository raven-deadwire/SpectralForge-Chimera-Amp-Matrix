name: 1.3.2 signal path, tuner and dynamics integration contracts
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'VERSION'
      - 'RELEASE_CHANNEL'
      - 'Tools/run_tuner_timing_probe.py'
      - '.github/workflows/signal-path.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-eq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  precision-tuner-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - run: cmake -S . -B build-tuner -DCMAKE_BUILD_TYPE=Release -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - run: cmake --build build-tuner --config Release --target ChimeraPrecisionTunerTests ChimeraPrecisionTunerIntegrationTests --parallel 2
      - run: ctest --test-dir build-tuner -C Release -R '^ChimeraPrecisionTuner(Integration)?Tests$' --output-on-failure --no-tests=error --output-junit tuner-results.xml
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrecisionTuner-Worker-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build-tuner/tuner-results.xml
            build-tuner/Testing/Temporary/LastTest.log
            build-tuner/chimera-build-version.json
          if-no-files-found: error
  native-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - run: cmake -S . -B build-path -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCHIMERA_BETA_QUALIFICATION_ONLY=ON
      - run: cmake --build build-path --config Release --target ChimeraUITests ChimeraCabPanelStateTests ChimeraGraphicalEQTests ChimeraGraphicalEQUITests ChimeraGraphicalEQEditingTests ChimeraCommonDynamicsTests ChimeraGateProcessorTests ChimeraAmpMatrix_Standalone --parallel 2
      - if: runner.os == 'Linux'
        run: cmake --build build-path --config Release --target ChimeraNativeFocusTests --parallel 2
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-path -C Release -R '^(ChimeraPrecisionTunerUITests|ChimeraCommonDynamics.*Tests|ChimeraSignalPathUITests|ChimeraNativeStateTests|ChimeraCabPanelStateTests|ChimeraGraphicalEQ.*Tests|ChimeraGateProcessorTests|ChimeraPackagingVersionTests)$' --output-on-failure --no-tests=error --output-junit integration-results.xml
      - if: runner.os == 'Linux'
        run: python3 Tools/run_linux_ui_tests.py -- ctest --test-dir build-path -C Release -R '^(ChimeraPrecisionTunerUITests|ChimeraCommonDynamics.*Tests|ChimeraSignalPathUITests|ChimeraNativeFocusTests|ChimeraNativeStateTests|ChimeraCabPanelStateTests|ChimeraGraphicalEQ.*Tests|ChimeraGateProcessorTests|ChimeraPackagingVersionTests)$' --output-on-failure --no-tests=error --output-junit integration-results.xml
      - name: Collect paired tuner callback observations (not a performance pass)
        if: always()
        run: python3 Tools/run_tuner_timing_probe.py build-path
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SignalEQ-Integration-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build-path/signal-path-snapshots/
            build-path/precision-tuner-snapshots/
            build-path/common-dynamics-snapshots/
            build-path/tuner-timing/
            build-path/integration-results.xml
            build-path/eq-cpu.csv
            build-path/eq-ui-*.png
            build-path/chimera-build-version.json
            build-path/Testing/Temporary/LastTest.log
            build-path/ChimeraAmpMatrix_artefacts/Release/Standalone/
            build-path/ChimeraAmpMatrix_artefacts/Standalone/
          if-no-files-found: error
