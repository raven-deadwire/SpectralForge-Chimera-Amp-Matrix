name: Signal path navigation contracts
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/signal-path.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - run: cmake -S . -B build-path -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON
      - run: cmake --build build-path --config Release --target ChimeraUITests ChimeraCabPanelStateTests ChimeraAmpMatrix_Standalone --parallel 2
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-path -C Release -R '^(ChimeraSignalPathUITests|ChimeraNativeStateTests|ChimeraCabPanelStateTests)$' --output-on-failure --no-tests=error
      - if: runner.os == 'Linux'
        run: python3 Tools/run_linux_ui_tests.py -- ctest --test-dir build-path -C Release -R '^(ChimeraSignalPathUITests|ChimeraNativeStateTests|ChimeraCabPanelStateTests)$' --output-on-failure --no-tests=error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignalPath-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-path/signal-path-snapshots/
            build-path/Testing/Temporary/LastTest.log
            build-path/ChimeraAmpMatrix_artefacts/Release/Standalone/
            build-path/ChimeraAmpMatrix_artefacts/Standalone/
          if-no-files-found: warn
