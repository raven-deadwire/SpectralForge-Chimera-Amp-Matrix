name: 1.3.1 signal path and EQ integration contracts
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/signal-path.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-eq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - run: cmake -S . -B build-path -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON
      - run: cmake --build build-path --config Release --target ChimeraUITests ChimeraCabPanelStateTests ChimeraGraphicalEQTests ChimeraGraphicalEQUITests ChimeraGateProcessorTests ChimeraAmpMatrix_Standalone --parallel 2
      - if: runner.os != 'Linux'
        run: ctest --test-dir build-path -C Release -R '^(ChimeraSignalPathUITests|ChimeraNativeStateTests|ChimeraCabPanelStateTests|ChimeraGraphicalEQ.*Tests|ChimeraGateProcessorTests|ChimeraPackagingVersionTests)$' --output-on-failure --no-tests=error --output-junit integration-results.xml
      - if: runner.os == 'Linux'
        run: python3 Tools/run_linux_ui_tests.py -- ctest --test-dir build-path -C Release -R '^(ChimeraSignalPathUITests|ChimeraNativeStateTests|ChimeraCabPanelStateTests|ChimeraGraphicalEQ.*Tests|ChimeraGateProcessorTests|ChimeraPackagingVersionTests)$' --output-on-failure --no-tests=error --output-junit integration-results.xml
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SignalEQ-Integration-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build-path/signal-path-snapshots/
            build-path/integration-results.xml
            build-path/eq-cpu.csv
            build-path/eq-ui-*.png
            build-path/chimera-build-version.json
            build-path/Testing/Temporary/LastTest.log
            build-path/ChimeraAmpMatrix_artefacts/Release/Standalone/
            build-path/ChimeraAmpMatrix_artefacts/Standalone/
          if-no-files-found: error
