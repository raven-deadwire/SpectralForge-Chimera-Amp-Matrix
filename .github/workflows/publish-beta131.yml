name: Review or publish verified Chimera release
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Source version to review or publish, for example 1.3.1-beta.2
        required: true
        type: string
      source_sha:
        description: Exact 40-character source SHA to review or publish
        required: true
        type: string
      publish:
        description: Publish only after separate source-specific approval and acceptance
        required: true
        default: false
        type: boolean
      confirm:
        description: 'For publication only: publish-v<TARGET_VERSION>@<FULL_SOURCE_SHA>'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  # Serialize tag creation and shared update-feed changes across all versions.
  group: publish-chimera-release
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Review release scope without publication
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          ACCEPTED_SHA: ${{ inputs.source_sha }}
        run: |
          python Tools/check_ir_distribution.py
          python Tests/test_ir_distribution.py
          python Tools/test_publish_beta131.py
          python Tools/test_beta_publication131.py
          python Tools/test_publish_release.py
          python Tools/test_weekly_publication.py
          python Tools/test_publication_evidence.py
          python Tests/test_packaging_version.py
          python Tools/publish_release.py --dry-run --target-version "$TARGET_VERSION" --source-sha "$ACCEPTED_SHA"
  release-gate:
    # Dedicated fail-closed gate: any BLOCKED, missing, stale or malformed
    # exact-source gate fails this job, and publish cannot start without it.
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require exact-source release-gate verdict PASS
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.target_version }}
          ACCEPTED_SHA: ${{ inputs.source_sha }}
        run: python Tools/publish_release.py --require-gate-pass --target-version "$TARGET_VERSION" --source-sha "$ACCEPTED_SHA" --wait-ci-seconds 5400
  publish:
    needs: release-gate
    if: github.repository == 'raven-deadwire/SpectralForge-Chimera-Amp-Matrix' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source and publisher contracts
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          ACCEPTED_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "publish-v$TARGET_VERSION@$ACCEPTED_SHA"
          test ! -f RELEASE_REVIEW_PENDING
          git diff --exit-code
          git diff --cached --exit-code
          python Tools/check_ir_distribution.py
          python Tests/test_ir_distribution.py
          python Tools/test_publish_beta131.py
          python Tools/test_beta_publication131.py
          python Tools/test_publish_release.py
          python Tools/test_weekly_publication.py
          python Tools/test_publication_evidence.py
          python Tests/test_packaging_version.py
      - name: Require exact-source CI and source-specific publication approval
        env:
          GH_TOKEN: ${{ github.token }}
          CHIMERA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_VERSION: ${{ inputs.target_version }}
          ACCEPTED_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: python Tools/publish_release.py --publish --target-version "$TARGET_VERSION" --source-sha "$ACCEPTED_SHA" --confirm "$CONFIRM" --wait-ci-seconds 5400
