name: CAB timing A/B (temporary)
# Temporary investigation of the macOS ChimeraCabExtendedTimingTests failure on
# PR #253: the CAB timing test built from #253's base (main 0b247dc) and from
# #253 (3624acc), run alternately A B B A on one macOS runner. Not a gate.
on:
  push:
    branches: [claude/quirky-fermi-b0k2ck]
    paths: ['.github/workflows/cab-timing-ab.yml', 'Tools/cab_timing_ab.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: 0b247dc1ea6278fa966197cb1cf06c9ac6cc07a2
          path: a
      - uses: actions/checkout@v4
        with:
          ref: 3624accd5416d37e1c790b0b462a6d08e23a3d5f
          path: b
      - name: Build the CAB timing test from both sources (Universal, as build.yml)
        run: |
          for side in a b; do
            cmake -S $side -B build-$side -DCHIMERA_BETA_QUALIFICATION_ONLY=ON -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 > /dev/null
            cmake --build build-$side --config Release --target ChimeraOriginalCabIntegrationTests --parallel 3
          done
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - name: Compare the two test binaries
        run: |
          for side in a b; do
            exe=$(find build-$side -type f -perm -111 -name "Chimera Original CAB Tests" -path "*MacOS*" | head -1)
            [ -n "$exe" ] || exe=$(find build-$side -type f -perm -111 -name "Chimera Original CAB Tests" | head -1)
            echo "$side: $exe"; shasum -a 256 "$exe"
            echo "$exe" > exe-$side.txt
          done
      - name: Run A B B A, three rounds
        run: python3 tools/Tools/cab_timing_ab.py --a "$(cat exe-a.txt)" --b "$(cat exe-b.txt)" --rounds 3 --out ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cab-timing-ab
          path: ab/
          if-no-files-found: ignore
