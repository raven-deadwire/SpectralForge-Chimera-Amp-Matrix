name: Chimera release publisher contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  publisher-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify version, approval, provenance and publication regressions
        shell: bash
        run: |
          python Tools/test_publish_release.py
          python Tools/test_weekly_publication.py
          python Tools/test_issue97_gate.py
          python Tools/test_publication_evidence.py
          python Tests/test_packaging_version.py
          python Tools/test_publish_beta131.py
          python Tools/test_beta_publication131.py
          python Tools/test_release_consolidator.py

  calendar-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check reservations and publication-scope regression contracts
        run: |
          python Tools/check_release_calendar.py
          python Tools/test_release_calendar.py
          python Tools/test_weekly_publication.py
          python Tools/test_issue97_gate.py
          python Tools/test_publish_release.py
  calendar-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject remote tags and public releases already consuming reservations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Tools/check_release_calendar.py --live
