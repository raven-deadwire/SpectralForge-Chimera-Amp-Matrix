name: CAB macOS navigation diagnosis (not release validation)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-navigation-diagnostic:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Record diagnostic source
        run: |
          mkdir -p cab-macos-diagnostic-evidence
          git rev-parse HEAD > cab-macos-diagnostic-evidence/source-sha.txt
          git status --porcelain > cab-macos-diagnostic-evidence/source-status.txt
          sw_vers > cab-macos-diagnostic-evidence/macos-version.txt
      - name: Configure unchanged CAB test target
        run: cmake -S . -B build-cab -DCMAKE_BUILD_TYPE=Release
      - name: Build the original complete CAB state test
        run: cmake --build build-cab --config Release --target ChimeraCabPanelStateTests --parallel 2
      - name: Run the full original scenario order once
        run: ctest --test-dir build-cab -C Release -R "^ChimeraCabPanelStateTests$" --output-on-failure --no-tests=error
      # A successful run means only NO REPRO. There is no product fix here,
      # retry, repeated test, relaxed deadline or alternative pass condition.
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CAB-macOS-navigation-diagnostic-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            cab-macos-diagnostic-evidence/**
            build-cab/Testing/Temporary/LastTest.log
            build-cab/cab-panel.png
            build-cab/original-cab-panel.png
            build-cab/cab-microphone-panel.png
            build-cab/cab-microphone-library.png
            build-cab/cab-integrated-panel.png
            build-cab/cab-visual-*.png
          if-no-files-found: error
