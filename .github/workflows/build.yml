            helper_sha256=sha('Tests/NativeMessageLoop.mm'),original_sha256=expected,
            no_CAB_instrumentation=True,no_sampler=True,no_test_deadline_change=True,
            execution_order=['original CAB CTest once','separate native controls once'],
