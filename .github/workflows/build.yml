name: Signal focus diagnostic (not release validation)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signal-focus-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, preserve-current]
    steps:
      - uses: actions/checkout@v5
      - name: Install native desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Configure standalone diagnostic
        run: cmake -S Tools/signal-focus-diagnostic -B build-focus -DCMAKE_BUILD_TYPE=Release -DCHIMERA_FOCUS_PRESERVE_CURRENT=${{ matrix.variant == 'preserve-current' && 'ON' || 'OFF' }}
      - name: Build standalone diagnostic
        run: cmake --build build-focus --target ChimeraSignalFocusDiagnostic --parallel 2
      - name: Run one diagnostic sequence on one native desktop
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/run_linux_ui_tests.py -- build-focus/ChimeraSignalFocusDiagnostic_artefacts/Release/ChimeraSignalFocusDiagnostic 2>&1 | tee build-focus/focus-diagnostic-${{ matrix.variant }}.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Signal-Focus-Diagnostic-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build-focus/focus-diagnostic-*.log
            build-focus/CMakeCache.txt
          if-no-files-found: error
