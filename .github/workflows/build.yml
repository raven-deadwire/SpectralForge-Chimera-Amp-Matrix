        set_target_properties(ChimeraReadySourceControls PROPERTIES CXX_STANDARD 20 OBJCXX_STANDARD 20)
        file(GENERATE OUTPUT "${CMAKE_BINARY_DIR}/ready-source-executable-$<CONFIG>.txt"
          CONTENT "$<TARGET_FILE:ChimeraReadySourceControls>\n")
        '''

        for relative,text in payloads.items():
            path = Path(relative)
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_text(text)
            destination = out/'candidate-source'/relative
            destination.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(path,destination)
        assert sha('Tests/NativeMessageLoop.mm') == '41bfbf7f9b9064ebc93e1e6f06ae6bf84f6de1394e156fc6a5d5879eb50a01d4'
        with Path('CMakeLists.txt').open('a') as stream:
            stream.write('\n# Isolated diagnostic target; no shipped-target changes.\ninclude("${CMAKE_CURRENT_SOURCE_DIR}/diagnostics/macos-ready-source/targets.cmake")\n')
        assert git('diff','--name-only').splitlines() == ['CMakeLists.txt','Tests/NativeMessageLoop.mm']
        for relative,digest in expected.items():
            if relative not in ('CMakeLists.txt','Tests/NativeMessageLoop.mm'):
                assert sha(relative) == digest, relative
        (out/'runtime.patch').write_text(git('diff','--','CMakeLists.txt','Tests/NativeMessageLoop.mm')+'\n')
        (out/'candidate.patch').write_text("--- a/Tests/NativeMessageLoop.mm\n+++ b/Tests/NativeMessageLoop.mm\n@@ -23,20 +23,39 @@\n         const double remaining=deadline-juce::Time::getMillisecondCounterHiRes();\n         if(remaining<=0)break;\n         @autoreleasepool {\n-            // Test-only fairness: JUCE serves four messages per CF source callback.\n-            // Keep servicing ready sources for this requested slice before AppKit\n-            // polling, whose internal native work may outlast its event deadline.\n-            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,remaining*.001),false);\n+            // JUCE serves four messages per CF source callback. Drain ready\n+            // sources without waiting, sharing the remaining slice with AppKit.\n+            // Each phase has a cooperative limit, not a preemptive time bound.\n+            const double sourceDeadline=deadline-remaining*.5;\n+            SInt32 sourceResult=kCFRunLoopRunFinished;\n+            do {\n+                sourceResult=CFRunLoopRunInMode(kCFRunLoopDefaultMode,0.0,true);\n+            } while(sourceResult==kCFRunLoopRunHandledSource\n+                && !messages->hasStopMessageBeenSent()\n+                && juce::Time::getMillisecondCounterHiRes()<sourceDeadline);\n+            // A CF callback or observer can overrun any requested duration.\n+            // Return control to the caller before starting another native phase.\n+            if(messages->hasStopMessageBeenSent()\n+                || juce::Time::getMillisecondCounterHiRes()>=deadline)break;\n             // On Tahoe, JUCE's future untilDate can defer callbacks until a\n             // later mouse event: https://github.com/juce-framework/JUCE/issues/1574\n-            // Poll AppKit without waiting; CFRunLoop above still yields normally.\n-            if(NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n+            // Poll AppKit without waiting; idle CF waiting follows the poll.\n+            NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n                                                untilDate:[NSDate distantPast]\n                                                   inMode:NSDefaultRunLoopMode\n-                                                 dequeue:YES])\n+                                                 dequeue:YES];\n+            if(event) {\n                 if(juce::isEventBlockedByModalComps==nullptr\n                     || !juce::isEventBlockedByModalComps(event))\n                     [NSApp sendEvent:event];\n+            } else if(sourceResult!=kCFRunLoopRunHandledSource\n+                && !messages->hasStopMessageBeenSent()) {\n+                // When neither poll reports ready work, yield to the run loop\n+                // until a source arrives or this call's remaining slice expires.\n+                const double idleRemaining=deadline-juce::Time::getMillisecondCounterHiRes();\n+                if(idleRemaining>0)\n+                    CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,idleRemaining*.001),true);\n+            }\n         }\n     }\n     return !messages->hasStopMessageBeenSent();\n")
        (out/'candidate-manifest.json').write_text('{\n  "status": "FINAL CONTROLLER PROPOSAL; native checks not yet run; not a release fix",\n  "source_sha": "781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333",\n  "scope": [\n    "Tests/NativeMessageLoop.mm"\n  ],\n  "original_sha256": "23ed1c047145f68f592840facd68eb628fb4cfe591757c00a23836eaa58f08e2",\n  "candidate_sha256": "41bfbf7f9b9064ebc93e1e6f06ae6bf84f6de1394e156fc6a5d5879eb50a01d4",\n  "patch_sha256": "b8fef1629cb791f3d918c03373e42c439a72a5389043c3a79554d4068cc02b05",\n  "change": "Zero-duration stop-after-source CF drain, cooperative half-budget source share, existing native poll/modal filter, bounded positive stop-after-source idle wait only after neither poll reports ready work.",\n  "unchanged": [\n    "all caller deadlines",\n    "asynchronous triggerClick",\n    "all readiness predicates",\n    "all failure latches",\n    "production UI and DSP",\n    "pinned JUCE source"\n  ],\n  "caveats": [\n    "No run-loop call can preempt a slow source, observer, timer, or native callback.",\n    "TimedOut at zero seconds is not a proof that no source can have become ready during a timer or observer callback.",\n    "Fair share is cooperative: one source callback can itself overrun the entire outer deadline.",\n    "Native zero-seconds return precedence must be demonstrated on macOS15, not assumed from historical open source."\n  ],\n  "required_native_checks": [\n    "Zero-duration true returns HandledSource for a signaled self-re-signaling version0 CF source, and TimedOut when installed source is idle.",\n    "More than four finite JUCE callbacks and tail fence complete FIFO before an expensive first native poll.",\n    "Continuously re-signaled cheap CF source still allows a real queued application-defined NSEvent to be delivered.",\n    "Idle native poll runs before positive idle yield; no tight empty-poll spin.",\n    "Original stop flag / return behavior and modal-event filter remain enforced.",\n    "Exact original CABPanelState target runs once with candidate helper; its original result remains authoritative."\n  ],\n  "probe_sha256": "198f89ea00ae86e0fd2c192421850b7d7c482fc55e91204efdfc836666a953bc",\n  "targets_sha256": "c6eb36220980fa7babbcad78fb37de3a832dc8ef3f6fb4748358ef768843526e",\n  "guarded_original_sha256": {\n    "Tests/NativeMessageLoop.mm": "23ed1c047145f68f592840facd68eb628fb4cfe591757c00a23836eaa58f08e2",\n    "Tests/NativeMessageLoop.h": "3768899735474cf425a96592adfc7fb6319a6a41e7a8a9403741f4131b045b38",\n    "Tests/CabSceneUITests.h": "3468e4aed6b281e3c635677802868118c6be2b0fde77ff196649c3519640a2d4",\n    "Tests/CabMicrophoneUITests.h": "8add9a45adf921cd140ff18493c0879a9e32f9bd3a46b22a3da667e576bb217e",\n    "Tests/CabPanelStateTests.cpp": "5e444621dabf1da6245889f920574716688290ae1ae6f7a7e4edde33cb183da9",\n    "CMakeLists.txt": "68e30347ccee79ef97bc0e733ee39f4cf36029733b475391b8b56bc4b8ca3aa3"\n  },\n  "execution_order": [\n    "one original CAB CTest on uninstrumented candidate helper",\n    "one separate native controls process"\n  ],\n  "process_counts": {\n    "original_CAB_CTest": 1,\n    "native_controls": 1,\n    "sampler": 0,\n    "original_GUI_baseline": 0\n  },\n  "build_configuration": "Original Release defaults; CHIMERA_UI_PROBES=OFF; no sanitizer/symbol/optimization override",\n  "result_policy": "CAB raw nonzero exit is authoritative; otherwise controls raw nonzero or receipt failure fails the workflow.",\n  "cold_process_limit": "CAB runs before native controls. No test-side warmup, forced callback/refresh or first-paint workaround is inserted.",\n  "control_parent_timeout_seconds": 120,\n  "CAB_parent_timeout_override": null\n}\n')
        shutil.copy2('diagnostic-controller/.github/workflows/build.yml',out/'controller-workflow.yml')
        record = dict(product_source_sha=base,controller_sha=controller,workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
