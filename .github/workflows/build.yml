name: Native Focus Regression Red Green Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-focus-regression-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, preserve-current]
    steps:
      - uses: actions/checkout@v5
      - name: Install native desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Configure the exact production regression
        run: cmake -S Tools/signal-focus-diagnostic -B build-focus -DCMAKE_BUILD_TYPE=Release -DCHIMERA_FOCUS_PRESERVE_CURRENT=${{ matrix.variant == 'preserve-current' && 'ON' || 'OFF' }}
      - name: Build the exact production regression
        run: cmake --build build-focus --target ChimeraNativeFocusTests --parallel 2
      - name: Run once and retain raw result
        shell: bash
        run: |
          set +e
          python3 Tools/run_linux_ui_tests.py -- build-focus/ChimeraNativeFocusTests_artefacts/Release/ChimeraNativeFocusTests 2>&1 | tee build-focus/native-focus-${{ matrix.variant }}.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > build-focus/native-focus-${{ matrix.variant }}.exit
          python3 - "${{ matrix.variant }}" "$result" <<'PY'
          import pathlib, sys
          variant, result = sys.argv[1], int(sys.argv[2])
          log = pathlib.Path(f"build-focus/native-focus-{variant}.log").read_text()
          if variant == "baseline":
              expected = "managed owner: delayed FocusIn replaced the requested target"
              assert result == 1 and expected in log, f"Baseline did not fail at the expected regression: exit={result}"
              print("EXPECTED BASELINE FAILURE: delayed native FocusIn overwrote requested child")
          else:
              assert result == 0 and "Native focus regressions PASS" in log, f"Patched regression failed: exit={result}"
              print("PATCHED REGRESSION PASS: exact final production test")
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Native-Focus-Regression-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build-focus/native-focus-*.log
            build-focus/native-focus-*.exit
            build-focus/CMakeCache.txt
          if-no-files-found: error
