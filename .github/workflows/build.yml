name: Diagnostic macOS queued-callback fairness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-pump-fairness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fairness:
    name: One controlled original/candidate scheduling pair
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact product source as diagnostic input
        uses: actions/checkout@v5
        with:
          ref: 7c782fda9e2d7cb255e70b6d1d1857fc78300c46
          path: source
          persist-credentials: false
      - name: Check out this manual controller separately
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and prepare the boolean-only pair
        shell: bash
        run: |
          python3 controller/diagnostics/macos-pump-fairness/diagnostic.py prepare
          xcodebuild -version > fairness-evidence/xcode-version.txt
          sw_vers > fairness-evidence/macos-version.txt
          clang++ --version > fairness-evidence/compiler-version.txt
          cmake --version > fairness-evidence/cmake-version.txt
      - name: Configure the two diagnostic targets
        shell: bash
        run: |
          cmake -S source -B build-fairness -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee fairness-evidence/configure.log
          python3 controller/diagnostics/macos-pump-fairness/diagnostic.py inspect
      - name: Build only the core/events diagnostic executables
        shell: bash
        run: |
          cmake --build build-fairness --config Release \
            --target ChimeraPumpFairnessOriginal ChimeraPumpFairnessCandidate --parallel 2 \
            2>&1 | tee fairness-evidence/build.log
      - name: Run each variant once and require the exact red/green evidence
        shell: bash
        run: python3 controller/diagnostics/macos-pump-fairness/diagnostic.py run
      - name: Preserve the actual outcome even if setup or the pair fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-pump-fairness-7c782fda-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: fairness-evidence/
          if-no-files-found: error
          retention-days: 14
