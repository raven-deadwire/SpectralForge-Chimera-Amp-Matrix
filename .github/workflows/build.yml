name: DIAGNOSTIC ONLY - macOS 7c native crash and dispatch
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: macos-native-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-not-release-certification:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: symbolize=1:abort_on_error=1:detect_leaks=0
    steps:
    - name: Checkout exact failed product source
      uses: actions/checkout@v5
      with:
        ref: 7c782fda9e2d7cb255e70b6d1d1857fc78300c46
        persist-credentials: false
    - name: Preserve isolated diagnostic controller
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: diagnostic-controller
        fetch-depth: 2
        sparse-checkout: .github/workflows/build.yml
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Apply passive probes to exact source and record provenance
      run: |
        python3 - <<'PY_DIAGNOSTIC'
        from pathlib import Path
        import hashlib, json, os, shutil, subprocess, time
        base = '7c782fda9e2d7cb255e70b6d1d1857fc78300c46'
        out = Path('build-macos-diagnostic/diagnostics')
        out.mkdir(parents=True, exist_ok=True)
        def git(*args, cwd=None):
            return subprocess.check_output(['git', *args], cwd=cwd, text=True).strip()
        assert git('rev-parse', 'HEAD') == base
        assert not git('diff', '--name-only')
        assert not git('diff', '--cached', '--name-only')
        controller = git('rev-parse', 'HEAD', cwd='diagnostic-controller')
        assert controller == os.environ['GITHUB_SHA']
        assert git('rev-parse', 'HEAD^', cwd='diagnostic-controller') == base
        assert git('diff', '--name-only', base, 'HEAD', cwd='diagnostic-controller').splitlines() == ['.github/workflows/build.yml']
        expected = {'Tests/SignalPathUITests.h': '107dce46494f9613b385930142515dd6cfe88d3fe0137bf69c9d6a079fc8c3f5', 'Tests/NativeMessageLoop.mm': '6c06b177982ccbece3e278f5734c701bf0fd67288ffb6402583f65a79fa758b6'}
        patches = [('Tests/SignalPathUITests.h', '    for(int preset=0;preset<spectralforge::selectablePresetCount;++preset){', '    // DIAGNOSTIC ONLY: passive reads; no refresh, dispatch, retry, or changed predicate.\n    const auto diagnosticStage=[&](const char* stage) {\n        const auto& observed=strip->snapshot();\n        const auto* cab=observed.find("cab.context4");\n        const auto* transpose=observed.find("transpose");\n        std::cerr<<"DIAGNOSTIC Signal Path stage="<<stage\n                 <<" monotonic_ms="<<juce::Time::getMillisecondCounterHiRes()\n                 <<" processor_mode="<<p->parameters().getRawParameterValue("mode")->load()\n                 <<" snapshot_mode="<<observed.mode<<" nodes="<<observed.nodes.size()\n                 <<" cab_context4_present="<<(cab!=nullptr)\n                 <<" transpose_present="<<(transpose!=nullptr)\n                 <<" stop_sent="<<juce::MessageManager::getInstance()->hasStopMessageBeenSent()\n                 <<std::endl;\n    };\n    for(int preset=0;preset<spectralforge::selectablePresetCount;++preset){'), ('Tests/SignalPathUITests.h', '        p->loadFactoryPreset(preset);settle(50);const auto expected=values(*p);writes.changes=writes.gestures=0;', '        if(preset==47)diagnosticStage("preset47-before-load");\n        p->loadFactoryPreset(preset);\n        if(preset==47)diagnosticStage("preset47-after-load-before-settle");\n        settle(50);\n        if(preset==47)diagnosticStage("preset47-after-settle");\n        const auto expected=values(*p);writes.changes=writes.gestures=0;'), ('Tests/SignalPathUITests.h', '        auto* pre=find<juce::TextButton>(*strip,"path.pre");click(*pre);', '        auto* pre=find<juce::TextButton>(*strip,"path.pre");click(*pre);\n        if(preset==47)diagnosticStage("preset47-after-click");'), ('Tests/SignalPathUITests.h', '    // Host changes converge through a presentation read, including inactive tabs.', '    diagnosticStage("presets-complete-before-host-changes");\n    // Host changes converge through a presentation read, including inactive tabs.'), ('Tests/SignalPathUITests.h', '    set(*p,"mode",2);set(*p,"cab2",0);set(*p,"gateAfterRig",1);set(*p,"transposeon",1);set(*p,"transpose",-2);settle(120);', '    set(*p,"mode",2);set(*p,"cab2",0);set(*p,"gateAfterRig",1);set(*p,"transposeon",1);set(*p,"transpose",-2);\n    diagnosticStage("host-changes-before-settle");\n    settle(120);\n    diagnosticStage("host-changes-after-settle-before-original-dereference");'), ('Tests/SignalPathUITests.h', '    {SignalPathView automated(*p,false);capture(automated,folder,"signal-path-matrix-post-gate");}', '    diagnosticStage("host-changes-after-original-assertion-before-capture");\n    {SignalPathView automated(*p,false);capture(automated,folder,"signal-path-matrix-post-gate");}\n    diagnosticStage("host-changes-after-capture");'), ('Tests/NativeMessageLoop.mm', 'namespace chimeraTest {\nbool dispatchFor(int milliseconds) {', 'namespace chimeraTest {\n// DIAGNOSTIC ONLY: observe completed native pump stages without changing their calls.\nstatic void diagnosticPumpStage(const char* stage,double started,double deadline) {\n    const auto finished=juce::Time::getMillisecondCounterHiRes();\n    if(finished-started>50.0)\n        std::cerr<<"DIAGNOSTIC macOS pump stage="<<stage<<" monotonic_ms="<<finished\n                 <<" elapsed_ms="<<(finished-started)<<" deadline_overrun_ms="<<(finished-deadline)\n                 <<" stop_sent="<<juce::MessageManager::getInstance()->hasStopMessageBeenSent()<<std::endl;\n}\nbool dispatchFor(int milliseconds) {'), ('Tests/NativeMessageLoop.mm', '            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,remaining*.001),true);', '            const auto cfStarted=juce::Time::getMillisecondCounterHiRes();\n            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,remaining*.001),true);\n            diagnosticPumpStage("CFRunLoopRunInMode",cfStarted,deadline);'), ('Tests/NativeMessageLoop.mm', '            if(NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n                                               untilDate:[NSDate distantPast]\n                                                  inMode:NSDefaultRunLoopMode\n                                                 dequeue:YES])\n                if(juce::isEventBlockedByModalComps==nullptr\n                    || !juce::isEventBlockedByModalComps(event))\n                    [NSApp sendEvent:event];', '            const auto nextStarted=juce::Time::getMillisecondCounterHiRes();\n            NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n                                               untilDate:[NSDate distantPast]\n                                                  inMode:NSDefaultRunLoopMode\n                                                 dequeue:YES];\n            diagnosticPumpStage("nextEventMatchingMask",nextStarted,deadline);\n            if(event)\n                if(juce::isEventBlockedByModalComps==nullptr\n                    || !juce::isEventBlockedByModalComps(event)) {\n                    const auto sendStarted=juce::Time::getMillisecondCounterHiRes();\n                    [NSApp sendEvent:event];\n                    diagnosticPumpStage("sendEvent",sendStarted,deadline);\n                }')]
        for relative, digest in expected.items():
            original = Path(relative).read_bytes()
            assert hashlib.sha256(original).hexdigest() == digest, relative
            target = out / 'original-source' / relative
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(original)
        for relative, old, new in patches:
            path = Path(relative)
            text = path.read_text()
            assert text.count(old) == 1, (relative, old)
            path.write_text(text.replace(old, new))
        assert git('diff', '--name-only').splitlines() == sorted(expected)
        for relative in expected:
            target = out / 'instrumented-source' / relative
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(relative, target)
        (out/'instrumentation.patch').write_text(git('diff', '--', *expected)+'\n')
        shutil.copy2('diagnostic-controller/.github/workflows/build.yml', out/'controller-workflow.yml')
        metadata = dict(purpose='DIAGNOSTIC ONLY; never release acceptance', product_source_sha=base,
            controller_sha=controller, workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
            run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
            original_sha256=expected,
            instrumented_sha256={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in expected},
            started_epoch=time.time(), runner_image=os.environ.get('ImageOS'),
            runner_image_version=os.environ.get('ImageVersion'), asan_options=os.environ['ASAN_OPTIONS'],
            caveat='ASan and passive logs perturb timing; no-reproduction is not release certification.')
        (out/'provenance.json').write_text(json.dumps(metadata, indent=2)+'\n')
        print(json.dumps(metadata, indent=2))
        PY_DIAGNOSTIC
        xcodebuild -version > build-macos-diagnostic/diagnostics/xcode-version.txt
        sw_vers > build-macos-diagnostic/diagnostics/macos-version.txt
        clang++ --version > build-macos-diagnostic/diagnostics/compiler-version.txt
    - name: Configure ASan diagnostic binaries with frame pointers
      run: |
        cmake -S . -B build-macos-diagnostic -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCHIMERA_UI_PROBES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          -DCMAKE_OBJCXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address" \
          2>&1 | tee build-macos-diagnostic/diagnostics/configure.log
    - name: Build only the two diagnostic executables
      id: build
      run: |
        cmake --build build-macos-diagnostic --config RelWithDebInfo --target ChimeraUITests ChimeraCabPanelStateTests --parallel 2 2>&1 | tee build-macos-diagnostic/diagnostics/build.log
    - name: Generate dSYMs and preserve binary identities
      id: symbols
      run: |
        ctest --test-dir build-macos-diagnostic -C RelWithDebInfo --show-only=json-v1 > build-macos-diagnostic/diagnostics/ctest-inventory.json
        python3 - <<'PY_SYMBOLS'
        from pathlib import Path
        import hashlib, json, subprocess
        out = Path('build-macos-diagnostic/diagnostics')
        inventory = json.loads((out/'ctest-inventory.json').read_text())
        names = {'ChimeraSignalPathUITests', 'ChimeraCabPanelStateTests'}
        tests = [t for t in inventory['tests'] if t['name'] in names]
        assert {t['name'] for t in tests} == names and len(tests) == 2
        records = []
        for test in tests:
            binary = Path(test['command'][0])
            assert binary.is_file()
            dsym = Path(str(binary)+'.dSYM')
            subprocess.run(['dsymutil', str(binary), '-o', str(dsym)], check=True)
            uuid = subprocess.check_output(['dwarfdump', '--uuid', str(binary), str(dsym)], text=True)
            records.append(dict(test=test['name'], command=test['command'], binary=str(binary),
                                sha256=hashlib.sha256(binary.read_bytes()).hexdigest(), symbol_uuid=uuid))
        (out/'binary-manifest.json').write_text(json.dumps(records, indent=2)+'\n')
        PY_SYMBOLS
        if symbolizer="$(xcrun --find llvm-symbolizer 2>/dev/null)"; then
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
          printf '%s\n' "$symbolizer" > build-macos-diagnostic/diagnostics/symbolizer.txt
        else
          printf '%s\n' 'Use Darwin default symbolization with adjacent dSYMs; raw addresses and binaries retained.' > build-macos-diagnostic/diagnostics/symbolizer.txt
        fi
    - name: Run Signal Path exactly once and preserve actual CTest result
      id: signal
      if: ${{ !cancelled() && steps.symbols.outcome == 'success' }}
      run: |
        export CHIMERA_LIFECYCLE_TRACE="$GITHUB_WORKSPACE/build-macos-diagnostic/diagnostics/signal-lifecycle.log"
        set +e
        ctest --test-dir build-macos-diagnostic -C RelWithDebInfo -R '^ChimeraSignalPathUITests$' -V --output-on-failure --no-tests=error --output-junit signal-results.xml 2>&1 | tee build-macos-diagnostic/diagnostics/signal-ctest.log
        pipeline_status=("${PIPESTATUS[@]}")
        set -e
        printf '%s\n' "${pipeline_status[0]}" > build-macos-diagnostic/diagnostics/signal-ctest-exit-code.txt
        printf '%s\n' "${pipeline_status[1]}" > build-macos-diagnostic/diagnostics/signal-tee-exit-code.txt
        copy_status=0
        cp build-macos-diagnostic/Testing/Temporary/LastTest.log build-macos-diagnostic/diagnostics/signal-LastTest.log || copy_status=$?
        printf '%s\n' "$copy_status" > build-macos-diagnostic/diagnostics/signal-LastTest-copy-exit-code.txt
        if (( pipeline_status[0] != 0 )); then exit "${pipeline_status[0]}"; fi
        if (( pipeline_status[1] != 0 )); then exit "${pipeline_status[1]}"; fi
        exit "$copy_status"
    - name: Run CAB state exactly once even if Signal Path failed
      id: cab
      if: ${{ !cancelled() && steps.symbols.outcome == 'success' }}
      run: |
        export CHIMERA_LIFECYCLE_TRACE="$GITHUB_WORKSPACE/build-macos-diagnostic/diagnostics/cab-lifecycle.log"
        set +e
        ctest --test-dir build-macos-diagnostic -C RelWithDebInfo -R '^ChimeraCabPanelStateTests$' -V --output-on-failure --no-tests=error --output-junit cab-results.xml 2>&1 | tee build-macos-diagnostic/diagnostics/cab-ctest.log
        pipeline_status=("${PIPESTATUS[@]}")
        set -e
        printf '%s\n' "${pipeline_status[0]}" > build-macos-diagnostic/diagnostics/cab-ctest-exit-code.txt
        printf '%s\n' "${pipeline_status[1]}" > build-macos-diagnostic/diagnostics/cab-tee-exit-code.txt
        copy_status=0
        cp build-macos-diagnostic/Testing/Temporary/LastTest.log build-macos-diagnostic/diagnostics/cab-LastTest.log || copy_status=$?
        printf '%s\n' "$copy_status" > build-macos-diagnostic/diagnostics/cab-LastTest-copy-exit-code.txt
        if (( pipeline_status[0] != 0 )); then exit "${pipeline_status[0]}"; fi
        if (( pipeline_status[1] != 0 )); then exit "${pipeline_status[1]}"; fi
        exit "$copy_status"
    - name: Collect OS crash reports without retrying either test
      if: always()
      run: |
        python3 - <<'PY_REPORTS'
        from pathlib import Path
        import hashlib, json, shutil, time
        out = Path('build-macos-diagnostic/diagnostics')
        out.mkdir(parents=True, exist_ok=True)
        provenance = out/'provenance.json'
        started = json.loads(provenance.read_text())['started_epoch'] if provenance.exists() else time.time()
        records = []
        for root in (Path.home()/'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')):
            if not root.exists():
                continue
            for report in root.iterdir():
                if not report.is_file() or report.suffix not in ('.ips', '.crash'):
                    continue
                if not report.name.startswith(('ChimeraUITests', 'Chimera UI Tests', 'ChimeraCabPanelStateTests', 'Chimera CAB Panel State Tests')) or report.stat().st_mtime < started:
                    continue
                target = out/'crash-reports'/report.name
                target.parent.mkdir(parents=True, exist_ok=True)
                shutil.copy2(report, target)
                records.append(dict(filename=report.name, sha256=hashlib.sha256(target.read_bytes()).hexdigest()))
        (out/'crash-report-manifest.json').write_text(json.dumps(dict(reports=records,
            note='Collected once after both probes; ASan stderr is retained regardless of OS report availability.'), indent=2)+'\n')
        PY_REPORTS
    - name: Upload diagnostics, symbols and native captures - not a release gate
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Diagnostic-macOS-native-7c782fda-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: |
          build-macos-diagnostic/diagnostics/
          build-macos-diagnostic/*-results.xml
          build-macos-diagnostic/chimera-build-version.json
          build-macos-diagnostic/CMakeCache.txt
          build-macos-diagnostic/compile_commands.json
          build-macos-diagnostic/Testing/Temporary/
          build-macos-diagnostic/signal-path-snapshots/
          build-macos-diagnostic/cab-panel.png
          build-macos-diagnostic/ChimeraUITests_artefacts/RelWithDebInfo/
          build-macos-diagnostic/ChimeraCabPanelStateTests_artefacts/RelWithDebInfo/
        if-no-files-found: error
        retention-days: 14
