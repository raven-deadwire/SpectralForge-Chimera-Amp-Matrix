name: Diagnostic macOS application event and stop compatibility

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-queue-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: One original and one U-candidate native queue compatibility process
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out original S diagnostic source
        uses: actions/checkout@v5
        with:
          ref: 3171605606e224c1ca63fc0f3827e992a19b481f
          path: source
          persist-credentials: false
      - name: Check out the exact U candidate helper separately
        uses: actions/checkout@v5
        with:
          ref: c291d7132ba33561db922e7d5a992ab40212345d
          path: candidate-source
          sparse-checkout: |
            Tests/NativeMessageLoop.mm
            Tests/NativeMessageLoop.h
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out the manual controller separately
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - name: Verify identities and prepare the two external targets
        run: |
          python3 controller/diagnostics/macos-queue-compatibility/diagnostic.py prepare
          xcodebuild -version > compatibility-evidence/xcode-version.txt
          sw_vers > compatibility-evidence/macos-version.txt
          clang++ --version > compatibility-evidence/compiler-version.txt
          cmake --version > compatibility-evidence/cmake-version.txt
      - name: Configure normal Release optimization with symbols
        run: |
          cmake -S source -B build-compatibility -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS=-g -DCMAKE_CXX_FLAGS=-g -DCMAKE_OBJCXX_FLAGS=-g \
            2>&1 | tee compatibility-evidence/configure.log
          python3 controller/diagnostics/macos-queue-compatibility/diagnostic.py inspect
      - name: Build only the two core and events probes
        run: |
          cmake --build build-compatibility --config Release \
            --target ChimeraQueueCompatibilityOriginal ChimeraQueueCompatibilityCandidate --parallel 2 \
            2>&1 | tee compatibility-evidence/build.log
      - name: Preserve exact binaries and matching dSYMs
        run: python3 controller/diagnostics/macos-queue-compatibility/diagnostic.py symbols
      - name: Run each process once and preserve actual outcomes
        run: python3 controller/diagnostics/macos-queue-compatibility/diagnostic.py run
      - name: Upload scoped compatibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-queue-compatibility-U-c291d713-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: compatibility-evidence/
          if-no-files-found: error
          retention-days: 14
