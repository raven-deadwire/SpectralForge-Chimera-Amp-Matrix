    - name: Configure original CAB Release mode and isolated control target
      run: |
        cmake -S . -B build-macos-ready-source -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee build-macos-ready-source/diagnostics/configure.log
    - name: Build only original CAB target and small native controls
      id: build
      run: |
        cmake --build build-macos-ready-source --config Release --target ChimeraCabPanelStateTests ChimeraReadySourceControls --parallel 2 2>&1 | tee build-macos-ready-source/diagnostics/build.log
    - name: Record exact binary, source and compilation identity
      id: identity
      run: |
        python3 - <<'PY_IDENTITY'
        from pathlib import Path
        import hashlib,json,subprocess
        build = Path('build-macos-ready-source').resolve()
        out = build/'diagnostics'
        inventory = json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'-C','Release','--show-only=json-v1'],text=True))
        (out/'ctest-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
        tests = [test for test in inventory['tests'] if test['name']=='ChimeraCabPanelStateTests']
        assert len(tests)==1
        cache = (build/'CMakeCache.txt').read_text().splitlines()
        assert 'CHIMERA_UI_PROBES:BOOL=OFF' in cache
        control = Path((build/'ready-source-executable-Release.txt').read_text().strip()).resolve()
        cab = Path(tests[0]['command'][0]).resolve()
        assert control.is_file() and cab.is_file() and control != cab
        records = [dict(role='CAB',path=str(cab),test_command=tests[0]['command']),dict(role='controls',path=str(control))]
        for record in records:
            record['sha256'] = hashlib.sha256(Path(record['path']).read_bytes()).hexdigest()
        (out/'binary-manifest.json').write_text(json.dumps(records,indent=2)+'\n')
        commands = json.loads((build/'compile_commands.json').read_text())
        selected = [entry for entry in commands if Path(entry['file']).name in ('NativeMessageLoop.mm','ReadySourceControls.mm','CabPanelStateTests.cpp')]
        (out/'selected-compile-commands.json').write_text(json.dumps(selected,indent=2)+'\n')
        assert len([entry for entry in selected if Path(entry['file']).name=='ReadySourceControls.mm'])==1
        print(json.dumps(records,indent=2))
        PY_IDENTITY
    - name: Run original CAB once, then native controls once, preserving both results
      id: validation
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
      run: |
        python3 - <<'PY_RUN'
        from pathlib import Path
        import hashlib,json,os,shutil,subprocess,sys,time
        build = Path('build-macos-ready-source').resolve()
        out = build/'diagnostics'
        manifest = json.loads((out/'binary-manifest.json').read_text())
        candidate = json.loads((out/'candidate-manifest.json').read_text())
        assert len(manifest)==2 and [item['role'] for item in manifest]==['CAB','controls']
        for item in manifest:
            assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['sha256']
        assert hashlib.sha256(Path('Tests/NativeMessageLoop.mm').read_bytes()).hexdigest()==candidate['candidate_sha256']
        env = dict(os.environ)
        env.pop('CHIMERA_LIFECYCLE_TRACE',None)
        commands = [
            ('CAB',['ctest','--test-dir',str(build),'-C','Release','-R','^ChimeraCabPanelStateTests$',
                '-V','--output-on-failure','--no-tests=error','--output-junit','cab-results.xml']),
            ('controls',[manifest[1]['path'],str(out/'native-controls.json')])]
        results = []
        for role,command in commands:
            # Exactly one launch per role. CAB is first. The second process still runs
            # after an ordinary nonzero CAB exit, without changing the frozen first result.
            record = dict(role=role,command=command,started_epoch=time.time(),launch_count=0)
            try:
                with (out/(role.lower()+'-process.log')).open('wb') as stream:
                    record['launch_count']=1
                    options = dict(stdout=stream,stderr=subprocess.STDOUT,env=env)
                    if role == 'controls':
                        options['timeout']=120
                        record['parent_timeout_seconds']=120
                    completed = subprocess.run(command,**options)
                    record['exit_code']=completed.returncode
                record['finished_epoch']=time.time()
                record['elapsed_seconds']=record['finished_epoch']-record['started_epoch']
                record['log_sha256']=hashlib.sha256((out/(role.lower()+'-process.log')).read_bytes()).hexdigest()
            except subprocess.TimeoutExpired:
                # Python run kills and reaps its direct control child before raising.
                # The controls create no descendants. CAB has no parent timeout override.
                record['exit_code']=124
                record['timed_out']=True
                record['finished_epoch']=time.time()
                record['elapsed_seconds']=record['finished_epoch']-record['started_epoch']
            except Exception as error:
                record.setdefault('exit_code',2)
                record['collection_error']=type(error).__name__+': '+str(error)
            results.append(record)
            (out/'execution-results.json').write_text(json.dumps(results,indent=2)+'\n')
            print(json.dumps(record,indent=2),flush=True)
            try:
                sys.stdout.buffer.write((out/(role.lower()+'-process.log')).read_bytes());sys.stdout.buffer.flush()
            except Exception as error:
                record['console_error']=type(error).__name__+': '+str(error)
        receipt_ok = False
        try:
            control = json.loads((out/'native-controls.json').read_text())
            receipt_ok = control.get('passed') is True and control.get('exit_code')==0 \
                and control.get('helper_sha256')==candidate['candidate_sha256']
        except Exception as error:
            results[-1]['receipt_error']=type(error).__name__+': '+str(error)
        cab_exit = results[0]['exit_code']
        control_exit = results[1]['exit_code']
        collector_error = any('collection_error' in item or 'console_error' in item for item in results)
        overall = cab_exit if cab_exit!=0 else control_exit if control_exit!=0 else 0 if receipt_ok and not collector_error else 2
        summary = dict(purpose='Candidate helper validation only; not release acceptance',execution_order=['CAB','controls'],
            results=results,controls_receipt_valid=receipt_ok,overall_exit_code=overall,
            original_CAB_exit_authoritative=True,source_sha='781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333',
            helper_sha256=candidate['candidate_sha256'],CAB_instrumentation=False,sampling=False,release_acceptance=False)
        (out/'execution-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
        print(json.dumps(summary,indent=2),flush=True)
        raise SystemExit(overall)
        PY_RUN
    - name: Collect original test logs and captures without executables
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      run: |
        python3 - <<'PY_COLLECT'
        from pathlib import Path
        import json,shutil
        build = Path('build-macos-ready-source')
        out = build/'diagnostics'
        if not out.is_dir():raise SystemExit(0)
        captures = []
        for source in build.rglob('*.png'):
            relative = source.relative_to(build)
            if '_deps' in relative.parts or 'diagnostics' in relative.parts:continue
            destination = out/'captures'/relative
            destination.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(source,destination);captures.append(str(relative))
        for name in ['LastTest.log','LastTestsFailed.log']:
            source=build/'Testing/Temporary'/name
            if source.is_file():shutil.copy2(source,out/name)
        for source in [build/'cab-results.xml',Path('cab-results.xml')]:
            if source.is_file():shutil.copy2(source,out/'cab-results.xml');break
        (out/'capture-manifest.json').write_text(json.dumps(captures,indent=2)+'\n')
        print(json.dumps(dict(captures=len(captures),binaries_archived=False,sampler=False)))
        PY_COLLECT
    - name: Upload candidate validation evidence
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: Diagnostic-macOS15-ready-source-781d03dd-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: build-macos-ready-source/diagnostics/
        if-no-files-found: error
        retention-days: 7
