name: v1 Build and Test
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload DSP verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-DSP-verification-${{ runner.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Upload Windows UI verification
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-Windows-UI-snapshots
          path: build/ui-snapshots/*.png
          if-no-files-found: warn

      - name: Package Windows test build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/Chimera-Amp-Matrix-1.0.0-test-win64"
          New-Item -ItemType Directory -Force -Path "$stage/VST3","$stage/Standalone" | Out-Null
          Copy-Item -Recurse "build/ChimeraAmpMatrix_artefacts/Release/VST3/*" "$stage/VST3/"
          Copy-Item -Recurse "build/ChimeraAmpMatrix_artefacts/Release/Standalone/*" "$stage/Standalone/"
          Copy-Item "docs/THIRD_PARTY_NOTICES.md","docs/AMP_VALIDATION.md" "$stage/"
          Copy-Item "docs/FX_AND_IR_DESIGN.md" "$stage/"
          Copy-Item -Recurse "build/reference-audio" "$stage/"
          Copy-Item "build/Testing/Temporary/LastTest.log" "$stage/Verification.txt"
          @"
          SpectralForge Chimera Amp Matrix 1.0.0 TEST BUILD
          =================================================
          Unsigned development build. Windows SmartScreen/Chrome may warn because
          this binary does not yet have an Authenticode publisher signature.

          Revision: ${{ github.sha }}
          Signal chain: input/gate/transpose -> PRE pedals -> rigs/cabs -> merge -> POST rack -> output.
          New: independent amp voices; 1x/2x/4x/8x oversampling; IR loading and project embedding;
          input/output gain and meters; noise gate; polyphonic transpose; chromatic tuner.
          Factory IRs: V30 / SM57 and Jensen / SM57, by jesterdyne (CC BY 4.0).
          User IR: WAV/AIFF, mono/stereo, <=1 second, <=4 MB. LOAD or drop onto a rig.
          Transpose adds the displayed latency when enabled; the host is notified.
          Tuner reads the original input. AUTO MUTE silences the output while tuning.
          Matrix LOW is clean DI with one-knob VCA-style COMP, LEVEL and BAND TONE.
          LOW bypasses Fuzz/Boost/Overdrive, amp and IR; its delay stays aligned to the other rigs.
          Matrix MID/HIGH use DRIVE / LEVEL / BAND TONE. Classic/Dual keep full EQ.
          PRE: Compressor, Envelope, Fuzz, Boost, Overdrive. Gate/Transpose stay on top.
          POST: Bus Comp, Preamp, EQ, Chorus, Delay, Reverb.
          Dual: adjustable full-range BLEND or LR4 low/high CROSSOVER.
          Top: presets, Stereo/Mono L, Doubler. Bottom: tuner, MIDI Learn, Tap/BPM, Click.
          Delay SYNC follows quarter-note tempo; HOST reads DAW BPM.
          A/B and MENU > Save reference store both sounds with embedded IRs.
          reference-audio contains deterministic synthetic DI and RMS-matched A/B WAVs.
          These fixtures test repeatability and voicing changes, not hardware accuracy.
          Use SIZE or resize the window for smaller screens.
          Amp voices are algorithmic interpretations; hardware fidelity is not yet established.
          See AMP_VALIDATION.md, FX_AND_IR_DESIGN.md, THIRD_PARTY_NOTICES.md and Verification.txt.

          VST3:
            Copy the .vst3 bundle to C:\Program Files\Common Files\VST3\

          Standalone:
            Run the executable from the Standalone folder.

          Verify:
            Compare the SHA256 of the ZIP with the .sha256.txt file supplied
            alongside it in this workflow run.
          "@ | Set-Content "$stage/README.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Chimera-Amp-Matrix-1.0.0-test-win64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/Chimera-Amp-Matrix-1.0.0-test-win64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Chimera-Amp-Matrix-1.0.0-test-win64.zip" | Set-Content "dist/Chimera-Amp-Matrix-1.0.0-test-win64.sha256.txt"
          Write-Host "SHA256: $hash"

      - name: Upload Windows test package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-Amp-Matrix-1.0.0-test-win64
          path: |
            dist/Chimera-Amp-Matrix-1.0.0-test-win64.zip
            dist/Chimera-Amp-Matrix-1.0.0-test-win64.sha256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload non-Windows build artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-1.0-${{ runner.os }}
          path: |
            build/ChimeraAmpMatrix_artefacts/Release/VST3/**
            build/ChimeraAmpMatrix_artefacts/Release/Standalone/**
            build/ChimeraAmpMatrix_artefacts/Release/AU/**
          if-no-files-found: error
