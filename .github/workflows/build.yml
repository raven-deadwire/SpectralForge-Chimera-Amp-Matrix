name: Diagnostic Windows measured-process priority preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-priority-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/diagnostic/windows-priority-preflight-781d03dd'
    name: One native Python priority and owned-child cleanup preflight
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve exact committed Python bytes in the isolated checkouts
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out immutable input source without building it
        uses: actions/checkout@v5
        with:
          ref: 781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333
          path: source
          sparse-checkout: Tools/run_cab_realtime_ci.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check out this manual controller separately
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run each tiny native control once without a product build
        shell: pwsh
        run: python controller/diagnostics/windows-priority-preflight/preflight.py
      - name: Preserve preflight identity, real receipts and child output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-priority-preflight-781d03dd-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: priority-preflight-evidence/
          if-no-files-found: error
          retention-days: 14
