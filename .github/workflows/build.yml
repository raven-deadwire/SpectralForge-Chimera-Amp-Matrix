name: DIAGNOSTIC ONLY - macOS CAB native stack profile
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: macos-cab-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cab-profile-not-release-certification:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout exact failed product source
      uses: actions/checkout@v5
      with:
        ref: 7c782fda9e2d7cb255e70b6d1d1857fc78300c46
        persist-credentials: false
    - name: Preserve isolated diagnostic controller
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: diagnostic-controller
        fetch-depth: 2
        sparse-checkout: .github/workflows/build.yml
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Apply passive probes to exact source and record provenance
      run: |
        python3 - <<'PY_DIAGNOSTIC'
        from pathlib import Path
        import hashlib, json, os, shutil, subprocess, time
        base = '7c782fda9e2d7cb255e70b6d1d1857fc78300c46'
        out = Path('build-macos-profile/diagnostics')
        out.mkdir(parents=True, exist_ok=True)
        def git(*args, cwd=None):
            return subprocess.check_output(['git', *args], cwd=cwd, text=True).strip()
        assert git('rev-parse', 'HEAD') == base
        assert not git('diff', '--name-only')
        assert not git('diff', '--cached', '--name-only')
        controller = git('rev-parse', 'HEAD', cwd='diagnostic-controller')
        assert controller == os.environ['GITHUB_SHA']
        assert git('rev-parse', 'HEAD^', cwd='diagnostic-controller') == base
        assert git('diff', '--name-only', base, 'HEAD', cwd='diagnostic-controller').splitlines() == ['.github/workflows/build.yml']
        expected = {'Tests/CabSceneUITests.h': '3468e4aed6b281e3c635677802868118c6be2b0fde77ff196649c3519640a2d4', 'Tests/NativeMessageLoop.mm': '6c06b177982ccbece3e278f5734c701bf0fd67288ffb6402583f65a79fa758b6'}
        patches = [('Tests/NativeMessageLoop.mm', '#include <iostream>', '#include <iostream>\n#include <iomanip>'), ('Tests/NativeMessageLoop.mm', 'namespace chimeraTest {\nbool dispatchFor(int milliseconds) {', 'namespace chimeraTest {\n// DIAGNOSTIC ONLY: observe completed native pump stages without changing their calls.\nstatic void diagnosticPumpStage(const char* stage,double started,double deadline) {\n    const auto finished=juce::Time::getMillisecondCounterHiRes();\n    if(finished-started>50.0)\n        std::cerr<<std::setprecision(12)<<"DIAGNOSTIC macOS pump stage="<<stage<<" monotonic_ms="<<finished\n                 <<" elapsed_ms="<<(finished-started)<<" deadline_overrun_ms="<<(finished-deadline)\n                 <<" stop_sent="<<juce::MessageManager::getInstance()->hasStopMessageBeenSent()<<std::endl;\n}\nbool dispatchFor(int milliseconds) {'), ['Tests/NativeMessageLoop.mm', '            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,remaining*.001),true);', '            const auto cfStarted=juce::Time::getMillisecondCounterHiRes();\n            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,remaining*.001),true);\n            diagnosticPumpStage("CFRunLoopRunInMode",cfStarted,deadline);'], ['Tests/NativeMessageLoop.mm', '            if(NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n                                               untilDate:[NSDate distantPast]\n                                                  inMode:NSDefaultRunLoopMode\n                                                 dequeue:YES])\n                if(juce::isEventBlockedByModalComps==nullptr\n                    || !juce::isEventBlockedByModalComps(event))\n                    [NSApp sendEvent:event];', '            const auto nextStarted=juce::Time::getMillisecondCounterHiRes();\n            NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny\n                                               untilDate:[NSDate distantPast]\n                                                  inMode:NSDefaultRunLoopMode\n                                                 dequeue:YES];\n            diagnosticPumpStage("nextEventMatchingMask",nextStarted,deadline);\n            if(event)\n                if(juce::isEventBlockedByModalComps==nullptr\n                    || !juce::isEventBlockedByModalComps(event)) {\n                    const auto sendStarted=juce::Time::getMillisecondCounterHiRes();\n                    [NSApp sendEvent:event];\n                    diagnosticPumpStage("sendEvent",sendStarted,deadline);\n                }'], ('Tests/CabSceneUITests.h', 'using namespace cabMicrophoneUITests;', 'using namespace cabMicrophoneUITests;\n\n// DIAGNOSTIC ONLY: phase/identity logging never dispatches native messages.\ninline void diagnosticCabPhase(const char* phase,const std::string& identity={}) {\n    std::ostringstream line;\n    line<<std::fixed<<std::setprecision(3)<<"DIAGNOSTIC CAB phase="<<phase\n        <<" monotonic_ms="<<juce::Time::getMillisecondCounterHiRes();\n    if(!identity.empty())line<<" component="<<identity;\n    std::cerr<<line.str()<<std::endl;\n}'), ('Tests/CabSceneUITests.h', '    const auto before=workspaceState();\n    button.triggerClick();', '    const auto before=workspaceState();\n    diagnosticCabPhase("click-begin",identity);\n    button.triggerClick();'), ('Tests/CabSceneUITests.h', '        throw std::runtime_error(detail.str());\n    }\n}', '        diagnosticCabPhase("click-timeout",identity);\n        throw std::runtime_error(detail.str());\n    }\n    diagnosticCabPhase("click-complete",identity);\n}'), ('Tests/CabSceneUITests.h', '    sceneInteractions(folder,screenshots);roomNavigation(screenshots);\n    constrainedWorkspace(screenshots);lowBlendControls(screenshots);\n    micVisualBoundaries(screenshots);editorNavigation(screenshots);', '    diagnosticCabPhase("before-sceneInteractions");\n    sceneInteractions(folder,screenshots);\n    diagnosticCabPhase("after-sceneInteractions");\n    diagnosticCabPhase("before-roomNavigation");\n    roomNavigation(screenshots);\n    diagnosticCabPhase("after-roomNavigation");\n    diagnosticCabPhase("before-constrainedWorkspace");\n    constrainedWorkspace(screenshots);\n    diagnosticCabPhase("after-constrainedWorkspace");\n    diagnosticCabPhase("before-lowBlendControls");\n    lowBlendControls(screenshots);\n    diagnosticCabPhase("after-lowBlendControls");\n    diagnosticCabPhase("before-micVisualBoundaries");\n    micVisualBoundaries(screenshots);\n    diagnosticCabPhase("after-micVisualBoundaries");\n    diagnosticCabPhase("before-editorNavigation");\n    editorNavigation(screenshots);\n    diagnosticCabPhase("after-editorNavigation");')]
        for relative, digest in expected.items():
            original = Path(relative).read_bytes()
            assert hashlib.sha256(original).hexdigest() == digest, relative
            target = out / 'original-source' / relative
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(original)
        for relative, old, new in patches:
            path = Path(relative)
            text = path.read_text()
            assert text.count(old) == 1, (relative, old)
            path.write_text(text.replace(old, new))
        assert git('diff', '--name-only').splitlines() == sorted(expected)
        for relative in expected:
            target = out / 'instrumented-source' / relative
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(relative, target)
        (out/'instrumentation.patch').write_text(git('diff', '--', *expected)+'\n')
        shutil.copy2('diagnostic-controller/.github/workflows/build.yml', out/'controller-workflow.yml')
        metadata = dict(purpose='DIAGNOSTIC ONLY; never release acceptance', product_source_sha=base,
            controller_sha=controller, workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
            run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
            original_sha256=expected,
            instrumented_sha256={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in expected},
            started_epoch=time.time(), runner_image=os.environ.get('ImageOS'),
            runner_image_version=os.environ.get('ImageVersion'), build_configuration='Release with symbols/frame pointers; noASan',
            caveat='Sampling and passive logs perturb timing; aggregate stacks cannot identify each timed callback; not release certification.')
        (out/'provenance.json').write_text(json.dumps(metadata, indent=2)+'\n')
        print(json.dumps(metadata, indent=2))
        PY_DIAGNOSTIC
        xcodebuild -version > build-macos-profile/diagnostics/xcode-version.txt
        sw_vers > build-macos-profile/diagnostics/macos-version.txt
        clang++ --version > build-macos-profile/diagnostics/compiler-version.txt
    - name: Configure original Release optimization with symbols and frame pointers
      run: |
        cmake -S . -B build-macos-profile -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          -DCMAKE_OBJCXX_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
          2>&1 | tee build-macos-profile/diagnostics/configure.log
    - name: Build only the original CAB state executable
      id: build
      run: |
        cmake --build build-macos-profile --config Release --target ChimeraCabPanelStateTests --parallel 2 2>&1 | tee build-macos-profile/diagnostics/build.log
    - name: Generate CAB dSYM and record exact executable identity
      id: symbols
      run: |
        ctest --test-dir build-macos-profile -C Release --show-only=json-v1 > build-macos-profile/diagnostics/ctest-inventory.json
        python3 - <<'PY_SYMBOLS'
        from pathlib import Path
        import hashlib, json, subprocess
        out = Path('build-macos-profile/diagnostics')
        inventory = json.loads((out/'ctest-inventory.json').read_text())
        names = {'ChimeraCabPanelStateTests'}
        tests = [t for t in inventory['tests'] if t['name'] in names]
        assert {t['name'] for t in tests} == names and len(tests) == 1
        records = []
        for test in tests:
            binary = Path(test['command'][0])
            assert binary.is_file()
            dsym = Path(str(binary)+'.dSYM')
            subprocess.run(['dsymutil', str(binary), '-o', str(dsym)], check=True)
            uuid = subprocess.check_output(['dwarfdump', '--uuid', str(binary), str(dsym)], text=True)
            records.append(dict(test=test['name'], command=test['command'], binary=str(binary),
                                sha256=hashlib.sha256(binary.read_bytes()).hexdigest(), symbol_uuid=uuid))
        (out/'binary-manifest.json').write_text(json.dumps(records, indent=2)+'\n')
        PY_SYMBOLS
    - name: Execute one original CAB CTest and sample only its owned process
      id: cab
      if: ${{ !cancelled() && steps.symbols.outcome == 'success' }}
      run: |
        python3 - <<'PY_PROFILE'
        # Embedded verbatim in the branch-only diagnostic workflow, never a product file.
        from pathlib import Path
        import ctypes, hashlib, json, os, shutil, subprocess, sys, threading, time
        build = Path('build-macos-profile').resolve()
        out = build/'diagnostics'
        manifest = json.loads((out/'binary-manifest.json').read_text())
        assert len(manifest) == 1 and manifest[0]['test'] == 'ChimeraCabPanelStateTests'
        binary = Path(manifest[0]['binary']).resolve()
        assert binary.is_file()
        assert hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest() == manifest[0]['sha256']
        libproc = None

        def identity(pid, expected_parent):
            fields = subprocess.run(['/bin/ps', '-p', str(pid), '-o', 'ppid=,uid='], capture_output=True, text=True)
            if fields.returncode != 0 or fields.stdout.split() != [str(expected_parent), str(os.getuid())]:
                return None
            buf = ctypes.create_string_buffer(4096)
            if libproc.proc_pidpath(pid, buf, len(buf)) <= 0:
                return None
            executable = Path(os.fsdecode(buf.value)).resolve()
            if executable != binary:
                return None
            return dict(pid=pid, parent_pid=expected_parent, uid=os.getuid(), executable=str(executable), observed_epoch=time.time())

        phase = threading.Event()
        reader_errors = []
        marker = b'DIAGNOSTIC CAB phase=before-sceneInteractions'
        ctest_command = ['ctest', '--test-dir', str(build), '-C', 'Release', '-R', '^ChimeraCabPanelStateTests$',
                         '-V', '--output-on-failure', '--no-tests=error', '--output-junit', 'cab-results.xml']
        env = dict(os.environ, CHIMERA_LIFECYCLE_TRACE=str(out/'cab-lifecycle.log'))
        record = dict(purpose='DIAGNOSTIC ONLY; not release acceptance', ctest_command=ctest_command,
                      started_epoch=time.time(), sampling_interval_ms=10, maximum_sampling_seconds=300,
                      sample_launch_count=0, trigger='before-sceneInteractions passive stderr marker',
                      limitation='sample is an aggregate call tree; it does not map an individual stack to an individual timed stage.')
        ctest = subprocess.Popen(ctest_command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=env)
        record['ctest_pid'] = ctest.pid

        def read_output():
            tail = b''
            log = None
            console_ok = True
            try:
                log = (out/'cab-ctest.log').open('wb')
            except Exception as error:
                reader_errors.append('open log: '+type(error).__name__+': '+str(error))
            while True:
                try:
                    chunk = ctest.stdout.read1(65536)
                except Exception as error:
                    reader_errors.append('read pipe: '+type(error).__name__+': '+str(error))
                    break
                if not chunk:
                    break
                combined = tail + chunk
                if marker in combined and not phase.is_set():
                    record['phase_trigger_observed_epoch'] = time.time()
                    phase.set()
                tail = combined[-len(marker):]
                if log is not None:
                    try:
                        log.write(chunk); log.flush()
                    except Exception as error:
                        reader_errors.append('write log: '+type(error).__name__+': '+str(error))
                        try: log.close()
                        except Exception: pass
                        log = None
                if console_ok:
                    try:
                        sys.stdout.buffer.write(chunk); sys.stdout.buffer.flush()
                    except Exception as error:
                        reader_errors.append('write console: '+type(error).__name__+': '+str(error))
                        console_ok = False
                # Sink failures must not stop draining the original CTest stdout pipe.
            if log is not None:
                try:
                    log.flush(); os.fsync(log.fileno()); log.close()
                except Exception as error:
                    reader_errors.append('close log: '+type(error).__name__+': '+str(error))

        reader = None
        reader_started = False
        reader_start_error = None
        try:
            reader = threading.Thread(target=read_output, daemon=True)
            reader.start()
            reader_started = True
        except Exception as error:
            reader_start_error = type(error).__name__+': '+str(error)
            reader_errors.append('reader startup: '+reader_start_error)
            read_output()  # Synchronous drain fallback; no retry/termination of the test.
        selected = None
        sampler = None
        sampler_watchdog = None
        sample_stream = None
        sampler_exit = None
        collector_error = None
        try:
            if reader_start_error:
                raise RuntimeError('Sampling skipped after reader startup failure: '+reader_start_error)
            usage = subprocess.run(['/usr/bin/sample'], capture_output=True, timeout=5)
            (out/'sample-usage.txt').write_bytes(usage.stdout + usage.stderr)
            (out/'sample-usage-exit-code.txt').write_text(str(usage.returncode)+'\n')
            libproc = ctypes.CDLL('/usr/lib/libproc.dylib', use_errno=True)
            libproc.proc_pidpath.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
            libproc.proc_pidpath.restype = ctypes.c_int
            discovery_deadline = time.monotonic() + 15
            while ctest.poll() is None and time.monotonic() < discovery_deadline:
                found = subprocess.run(['/usr/bin/pgrep', '-P', str(ctest.pid)], capture_output=True, text=True)
                candidates = []
                if found.returncode not in (0, 1):
                    raise RuntimeError('Owned CTest child discovery failed')
                for value in found.stdout.split():
                    observed = identity(int(value), ctest.pid)
                    if observed is not None:
                        candidates.append(observed)
                if len(candidates) > 1:
                    raise RuntimeError('More than one matching owned CAB test child')
                if candidates:
                    selected = candidates[0]
                    break
                time.sleep(.02)
            if selected is None:
                raise RuntimeError('Exact owned CAB test child not observed within15s')
            record['selected_child'] = selected
            trigger_deadline = time.monotonic() + 300
            while ctest.poll() is None and not phase.wait(.05) and time.monotonic() < trigger_deadline:
                pass
            if not phase.is_set():
                raise RuntimeError('CAB scene phase was not observed before process exit or300s observation bound')
            rechecked = identity(selected['pid'], ctest.pid)
            if rechecked is None or ctest.poll() is not None:
                raise RuntimeError('Owned CAB identity changed before sampler launch')
            record['identity_at_sample_launch'] = rechecked
            sample_command = ['/usr/bin/sample', str(selected['pid']), '300', '10', '-mayDie', '-fullPaths',
                              '-file', str(out/'cab-main-thread.sample.txt')]
            record['sample_command'] = sample_command
            record['sample_started_epoch'] = time.time()
            sample_started_monotonic = time.monotonic()
            sample_stream = (out/'sample-driver.log').open('wb')
            sampler = subprocess.Popen(sample_command, stdout=sample_stream, stderr=subprocess.STDOUT)
            record['sample_launch_count'] = 1
            record['sampler_pid'] = sampler.pid
            def stop_overdue_sampler():
                if sampler.poll() is not None:
                    return
                record['sampler_timeout'] = True
                try:
                    sampler.terminate()  # Only this diagnostic sampler, never the test.
                    try:
                        sampler.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        sampler.kill()
                except ProcessLookupError:
                    pass
            sampler_watchdog = threading.Timer(320, stop_overdue_sampler)
            sampler_watchdog.daemon = True
            sampler_watchdog.start()
        except Exception as error:
            collector_error = type(error).__name__+': '+str(error)

        # Never terminate, retry, or alter the original test because sampler setup failed.
        ctest_exit = ctest.wait()
        try:
            record['ctest_finished_epoch'] = time.time()
            record['ctest_exit_code'] = ctest_exit
            try:
                (out/'cab-ctest-exit-code.txt').write_text(str(ctest_exit)+'\n')
            except OSError as error:
                reader_errors.append('write raw CTest status: '+type(error).__name__+': '+str(error))
            if reader_started:
                reader.join(timeout=5)
                if reader.is_alive():
                    reader_errors.append('stdout reader did not finish within5s after CTest exit')
            if sampler is not None:
                remaining = max(.001, 320-(time.monotonic()-sample_started_monotonic))
                try:
                    sampler_exit = sampler.wait(timeout=remaining)
                except subprocess.TimeoutExpired:
                    record['sampler_timeout'] = True
                    try: sampler.terminate()
                    except ProcessLookupError: pass
                    try:
                        sampler_exit = sampler.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        try: sampler.kill()
                        except ProcessLookupError: pass
                        sampler_exit = sampler.wait(timeout=5)
                if sampler_watchdog is not None:
                    sampler_watchdog.cancel()
                    if sampler_watchdog.is_alive(): sampler_watchdog.join(timeout=6)
                record['sample_finished_epoch'] = time.time()
            if sample_stream is not None:
                sample_stream.flush(); os.fsync(sample_stream.fileno()); sample_stream.close()
            record['sample_exit_code'] = sampler_exit
            record['collector_error'] = collector_error
            record['reader_errors'] = reader_errors
            sample_file = out/'cab-main-thread.sample.txt'
            record['sample_file_exists'] = sample_file.is_file()
            record['sample_bytes'] = sample_file.stat().st_size if sample_file.is_file() else 0
            if sample_file.is_file():
                record['sample_sha256'] = hashlib.file_digest(sample_file.open('rb'), 'sha256').hexdigest()
            try:
                shutil.copy2(build/'Testing/Temporary/LastTest.log', out/'cab-LastTest.log')
                record['last_test_copy_ok'] = True
            except OSError as error:
                record['last_test_copy_ok'] = False
                record['last_test_copy_error'] = type(error).__name__+': '+str(error)
            (out/'sample-exit-code.txt').write_text(str(sampler_exit)+'\n')
            (out/'sampling-run.json').write_text(json.dumps(record, indent=2)+'\n')
            print(json.dumps(record, indent=2), flush=True)
            if collector_error or reader_errors or record.get('sampler_timeout') or not record['last_test_copy_ok'] or sampler_exit != 0 or not record['sample_bytes']:
                raise SystemExit(2)
        finally:
            # A sampler, output sink, or finalization failure never replaces the
            # original nonzero CTest result.
            if ctest_exit:
                raise SystemExit(ctest_exit if ctest_exit > 0 else 128-ctest_exit)
        PY_PROFILE
    - name: Collect OS crash reports after the single CAB profile
      if: always()
      run: |
        python3 - <<'PY_REPORTS'
        from pathlib import Path
        import hashlib, json, shutil, time
        out = Path('build-macos-profile/diagnostics')
        out.mkdir(parents=True, exist_ok=True)
        provenance = out/'provenance.json'
        started = json.loads(provenance.read_text())['started_epoch'] if provenance.exists() else time.time()
        records = []
        for root in (Path.home()/'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')):
            if not root.exists():
                continue
            for report in root.iterdir():
                if not report.is_file() or report.suffix not in ('.ips', '.crash'):
                    continue
                if not report.name.startswith(('ChimeraUITests', 'Chimera UI Tests', 'ChimeraCabPanelStateTests', 'Chimera CAB Panel State Tests')) or report.stat().st_mtime < started:
                    continue
                target = out/'crash-reports'/report.name
                target.parent.mkdir(parents=True, exist_ok=True)
                shutil.copy2(report, target)
                records.append(dict(filename=report.name, sha256=hashlib.sha256(target.read_bytes()).hexdigest()))
        (out/'crash-report-manifest.json').write_text(json.dumps(dict(reports=records,
            note='Collected once after the single CAB profile; CTest stderr and native sampler output are retained.'), indent=2)+'\n')
        PY_REPORTS
    - name: Upload raw CAB test and native sampling evidence - not a release gate
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: Diagnostic-macOS-CAB-profile-7c782fda-${{ github.sha }}-attempt-${{ github.run_attempt }}
        path: |
          build-macos-profile/diagnostics/
          build-macos-profile/*-results.xml
          build-macos-profile/chimera-build-version.json
          build-macos-profile/CMakeCache.txt
          build-macos-profile/compile_commands.json
          build-macos-profile/Testing/Temporary/
          build-macos-profile/cab-panel.png
          build-macos-profile/ChimeraCabPanelStateTests_artefacts/Release/
        if-no-files-found: error
        retention-days: 14
