name: DIAGNOSTIC ONLY - macOS cold CAB click trace
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-cold-click-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-click-observation-not-release-certification:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact failed source 781d
        uses: actions/checkout@v5
        with:
          ref: 781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333
          persist-credentials: false
      - name: Checkout isolated controller
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: diagnostic-controller
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows/build.yml
            diagnostics/macos-cold-click
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify source and apply passive observations
        run: |
          python3 diagnostic-controller/diagnostics/macos-cold-click/prepare.py prepare
          sw_vers > build-macos-cold-click/diagnostics/macos-version.txt
          uname -m > build-macos-cold-click/diagnostics/architecture.txt
          xcodebuild -version > build-macos-cold-click/diagnostics/xcode-version.txt
          clang++ --version > build-macos-cold-click/diagnostics/compiler-version.txt
      - name: Configure normal Release optimization with symbols
        run: |
          cmake -S . -B build-macos-cold-click -DCMAKE_BUILD_TYPE=Release -DCHIMERA_UI_PROBES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            -DCMAKE_OBJCXX_FLAGS="-g -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            2>&1 | tee build-macos-cold-click/diagnostics/configure.log
          python3 diagnostic-controller/diagnostics/macos-cold-click/prepare.py juce
      - name: Build only original CAB state executable
        id: build
        run: |
          cmake --build build-macos-cold-click --config Release --target ChimeraCabPanelStateTests --parallel 2 \
            2>&1 | tee build-macos-cold-click/diagnostics/build.log
      - name: Preserve executable UUID dSYM and compile flags
        id: symbols
        run: python3 diagnostic-controller/diagnostics/macos-cold-click/collect.py symbols
      - name: Run the original CAB state test once and observe its first cold click
        id: cab
        if: ${{ !cancelled() && steps.symbols.outcome == 'success' }}
        run: python3 diagnostic-controller/diagnostics/macos-cold-click/collect.py run
      - name: Retain diagnostic and the original first result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macOS-cold-click-781d-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
          path: |
            build-macos-cold-click/diagnostics
            build-macos-cold-click/cab-results.xml
            build-macos-cold-click/Testing/Temporary
            build-macos-cold-click/*.png
            build-macos-cold-click/ChimeraCabPanelStateTests_artefacts/Release/ChimeraCabPanelStateTests
            build-macos-cold-click/ChimeraCabPanelStateTests_artefacts/Release/ChimeraCabPanelStateTests.dSYM
