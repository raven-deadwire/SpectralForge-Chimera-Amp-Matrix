name: DIAGNOSTIC ONLY - 781d macOS ready source correction
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: macos-ready-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cab-first-then-native-controls-not-release-certification:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout exact failed source
      uses: actions/checkout@v5
      with:
        ref: 781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333
        persist-credentials: false
    - name: Preserve branch-only controller
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: diagnostic-controller
        fetch-depth: 2
        sparse-checkout: .github/workflows/build.yml
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Apply exact helper candidate and add isolated native controls
      id: source
      run: |
        python3 - <<'PY_APPLY'
        from pathlib import Path
        import hashlib, json, os, shutil, subprocess, time
        base = '781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333'
        build = Path('build-macos-ready-source')
        out = build/'diagnostics'
        out.mkdir(parents=True, exist_ok=True)
        def git(*args,cwd=None):
            return subprocess.check_output(['git',*args],cwd=cwd,text=True).strip()
        def sha(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()
        assert git('rev-parse','HEAD') == base
        assert not git('diff','--name-only') and not git('diff','--cached','--name-only')
        controller = git('rev-parse','HEAD',cwd='diagnostic-controller')
        assert controller == os.environ['GITHUB_SHA']
        assert git('rev-parse','HEAD^',cwd='diagnostic-controller') == base
        assert git('diff','--name-only',base,'HEAD',cwd='diagnostic-controller').splitlines() == ['.github/workflows/build.yml']
        expected = {'Tests/NativeMessageLoop.mm': '23ed1c047145f68f592840facd68eb628fb4cfe591757c00a23836eaa58f08e2', 'Tests/NativeMessageLoop.h': '3768899735474cf425a96592adfc7fb6319a6a41e7a8a9403741f4131b045b38', 'Tests/CabSceneUITests.h': '3468e4aed6b281e3c635677802868118c6be2b0fde77ff196649c3519640a2d4', 'Tests/CabMicrophoneUITests.h': '8add9a45adf921cd140ff18493c0879a9e32f9bd3a46b22a3da667e576bb217e', 'Tests/CabPanelStateTests.cpp': '5e444621dabf1da6245889f920574716688290ae1ae6f7a7e4edde33cb183da9', 'CMakeLists.txt': '68e30347ccee79ef97bc0e733ee39f4cf36029733b475391b8b56bc4b8ca3aa3'}
        for relative,digest in expected.items():
            assert sha(relative) == digest, relative
            destination = out/'original-source'/relative
            destination.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(relative,destination)
        payloads = {}
        payloads['Tests/NativeMessageLoop.mm'] = r'''#include "NativeMessageLoop.h"
        #import <Cocoa/Cocoa.h>
        #include <iostream>

        namespace juce {
        // Same modal-event filter used by the pinned JUCE 8.0.8 dispatcher. Preserve
        // modal input blocking rather than sending events straight past its policy.
        extern bool (*isEventBlockedByModalComps)(NSEvent*);
        }

        namespace chimeraTest {
        bool dispatchFor(int milliseconds) {
            auto* messages=juce::MessageManager::getInstance();
            jassert(messages->isThisTheMessageThread());
            if(!messages->isThisTheMessageThread())return false;
            static const bool announced=[] {
                std::cout<<"TEST HARNESS: non-blocking macOS native event pump (JUCE #1574)\n";
                return true;
            }();
            (void)announced;
            const double deadline=juce::Time::getMillisecondCounterHiRes()+milliseconds;
            while(!messages->hasStopMessageBeenSent()) {
                const double remaining=deadline-juce::Time::getMillisecondCounterHiRes();
                if(remaining<=0)break;
                @autoreleasepool {
                    // JUCE serves four messages per CF source callback. Drain ready
                    // sources without waiting, sharing the remaining slice with AppKit.
                    // Each phase has a cooperative limit, not a preemptive time bound.
                    const double sourceDeadline=deadline-remaining*.5;
                    SInt32 sourceResult=kCFRunLoopRunFinished;
                    do {
                        sourceResult=CFRunLoopRunInMode(kCFRunLoopDefaultMode,0.0,true);
                    } while(sourceResult==kCFRunLoopRunHandledSource
                        && !messages->hasStopMessageBeenSent()
                        && juce::Time::getMillisecondCounterHiRes()<sourceDeadline);
                    // A CF callback or observer can overrun any requested duration.
                    // Return control to the caller before starting another native phase.
                    if(messages->hasStopMessageBeenSent()
                        || juce::Time::getMillisecondCounterHiRes()>=deadline)break;
                    // On Tahoe, JUCE's future untilDate can defer callbacks until a
                    // later mouse event: https://github.com/juce-framework/JUCE/issues/1574
                    // Poll AppKit without waiting; idle CF waiting follows the poll.
                    NSEvent* event=[NSApp nextEventMatchingMask:NSEventMaskAny
                                                       untilDate:[NSDate distantPast]
                                                          inMode:NSDefaultRunLoopMode
                                                         dequeue:YES];
                    if(event) {
                        if(juce::isEventBlockedByModalComps==nullptr
                            || !juce::isEventBlockedByModalComps(event))
                            [NSApp sendEvent:event];
                    } else if(sourceResult!=kCFRunLoopRunHandledSource
                        && !messages->hasStopMessageBeenSent()) {
                        // When neither poll reports ready work, yield to the run loop
                        // until a source arrives or this call's remaining slice expires.
                        const double idleRemaining=deadline-juce::Time::getMillisecondCounterHiRes();
                        if(idleRemaining>0)
                            CFRunLoopRunInMode(kCFRunLoopDefaultMode,juce::jmin(.01,idleRemaining*.001),true);
                    }
                }
            }
            return !messages->hasStopMessageBeenSent();
        }
        }
        '''
        payloads['diagnostics/macos-ready-source/ReadySourceControls.mm'] = r'''#include "NativeMessageLoop.h"
        #import <Cocoa/Cocoa.h>
        #include <CoreFoundation/CoreFoundation.h>
        #include <array>
        #include <fstream>
        #include <iostream>
        #include <memory>

        namespace juce { extern bool (*isEventBlockedByModalComps)(NSEvent*); }

        namespace {
        constexpr int callbackCount=12, finiteBudgetMs=10, expensivePollMs=20, sliceMs=20;
        constexpr double deliveryLimitMs=2000.0;
        constexpr NSInteger eventTag=0x43485244;
        constexpr short saturatedSubtype=171, blockedSubtype=172, allowedSubtype=173;
        enum class Phase { none, finite, saturated, idle, modal, stop };
        struct State {
            Phase phase=Phase::none;
            std::array<int,callbackCount> order{}, firstPollOrder{};
            int posts{},delivered{},finitePolls{},firstPollDelivered{-1};
            bool fence{},firstPollFence{},wrongThread{};
            double started{},fenceMs{-1},firstPollMs{-1},pollBlockMs{};
            int nativeDepth{},saturatedPolls{},saturatedDeliveries{},saturatedSuperReturns{};
            double saturatedStarted{},saturatedDeliveryMs{-1};
            int idlePolls{},idleWaits{},firstIdleWaitPolls{-1};
            int blockedFilters{},allowedFilters{},blockedDeliveries{},allowedDeliveries{},allowedSuperReturns{};
            bool stopCallback{},stopReturned{};
        };
        State* active=nullptr;
        bool (*previousModalFilter)(NSEvent*)=nullptr;
        double now() {return juce::Time::getMillisecondCounterHiRes();}
        bool messageThread() {
            return [NSThread isMainThread] && juce::MessageManager::getInstance()->isThisTheMessageThread();
        }
        bool fifo(const std::array<int,callbackCount>& order,int count) {
            if(count!=callbackCount)return false;
            for(int i=0;i<count;++i)if(order[size_t(i)]!=i)return false;
            return true;
        }
        juce::var arrayValue(const std::array<int,callbackCount>& order) {
            juce::Array<juce::var> result;for(int value:order)result.add(value);return result;
        }
        juce::var object() {return juce::var(new juce::DynamicObject());}
        void put(juce::var& value,const char* key,const juce::var& item) {value.getDynamicObject()->setProperty(key,item);}
        bool ourEvent(NSEvent* event) {
            return event.type==NSEventTypeApplicationDefined && event.data1==eventTag;
        }
        bool postEvent(short subtype) {
            NSEvent* event=[NSEvent otherEventWithType:NSEventTypeApplicationDefined
                location:NSZeroPoint modifierFlags:0 timestamp:[NSProcessInfo processInfo].systemUptime
                windowNumber:0 context:nil subtype:subtype data1:eventTag data2:781];
            if(event==nil)return false;
            [NSApp postEvent:event atStart:NO];return true;
        }
        bool modalFilter(NSEvent* event) {
            if(active!=nullptr && active->phase==Phase::modal && ourEvent(event)) {
                active->wrongThread|=!messageThread();
                if(event.subtype==blockedSubtype) {++active->blockedFilters;return true;}
                if(event.subtype==allowedSubtype)++active->allowedFilters;
            }
            return previousModalFilter!=nullptr && previousModalFilter(event);
        }
        struct SourceState {
            CFRunLoopSourceRef source{};
            int calls{},limit{};
            bool repeat{},wrongThread{};
        };
        void sourceCallback(void* context) {
            auto& state=*static_cast<SourceState*>(context);
            state.wrongThread|=!messageThread();++state.calls;
            if(state.repeat && (state.limit==0 || state.calls<state.limit)) {
                CFRunLoopSourceSignal(state.source);CFRunLoopWakeUp(CFRunLoopGetCurrent());
            }
        }
        struct Source {
            SourceState state;
            CFStringRef mode;
            explicit Source(CFStringRef requestedMode,int limit):mode(requestedMode) {
                state.repeat=true;state.limit=limit;
                CFRunLoopSourceContext context{};context.info=&state;context.perform=sourceCallback;
                state.source=CFRunLoopSourceCreate(kCFAllocatorDefault,0,&context);
                if(state.source!=nullptr)CFRunLoopAddSource(CFRunLoopGetCurrent(),state.source,mode);
            }
            void signal() {CFRunLoopSourceSignal(state.source);CFRunLoopWakeUp(CFRunLoopGetCurrent());}
            ~Source() {
                state.repeat=false;
                if(state.source!=nullptr) {
                    CFRunLoopRemoveSource(CFRunLoopGetCurrent(),state.source,mode);
                    CFRunLoopSourceInvalidate(state.source);CFRelease(state.source);
                }
            }
        };
        struct ZeroObserverState {int entries{},beforeTimers{},beforeSources{},beforeWaiting{},exits{};};
        void zeroObserver(CFRunLoopObserverRef,CFRunLoopActivity activity,void* context) {
            auto& state=*static_cast<ZeroObserverState*>(context);
            if(activity==kCFRunLoopEntry)++state.entries;
            if(activity==kCFRunLoopBeforeTimers)++state.beforeTimers;
            if(activity==kCFRunLoopBeforeSources)++state.beforeSources;
            if(activity==kCFRunLoopBeforeWaiting)++state.beforeWaiting;
            if(activity==kCFRunLoopExit)++state.exits;
        }
        void idleObserver(CFRunLoopObserverRef,CFRunLoopActivity activity,void*) {
            if(active!=nullptr && active->phase==Phase::idle && active->nativeDepth==0
                && activity==kCFRunLoopBeforeWaiting) {
                if(active->idleWaits++==0)active->firstIdleWaitPolls=active->idlePolls;
            }
        }
        template<class Predicate> bool progressUntil(Predicate ready) {
            const double deadline=now()+deliveryLimitMs;
            while(!ready() && now()<deadline)
                if(!chimeraTest::dispatchFor(sliceMs))return false;
            return ready();
        }
        int writeReport(juce::var report,const char* path,int result) {
            put(report,"exit_code",result);put(report,"release_acceptance",false);
            put(report,"outcome_frozen_before_cleanup",true);
            const auto text=juce::JSON::toString(report,true).toStdString();
            std::cout<<text<<std::endl;
            std::ofstream file(path,std::ios::binary|std::ios::trunc);file<<text<<'\n';file.close();
            if(!file)return 2;return result;
        }
        }

        @interface ChimeraReadySourceApplication : NSApplication
        @end
        @implementation ChimeraReadySourceApplication
        - (NSEvent*)nextEventMatchingMask:(NSEventMask)mask untilDate:(NSDate*)expiration
                                  inMode:(NSRunLoopMode)mode dequeue:(BOOL)dequeue {
            State* const state=active;
            if(state!=nullptr && state->phase==Phase::finite) {
                const double begin=now();
                if(++state->finitePolls==1) {
                    state->firstPollDelivered=state->delivered;state->firstPollFence=state->fence;
                    state->firstPollOrder=state->order;state->firstPollMs=begin-state->started;
                }
                // Controlled expensive poll only in the finite-FIFO subtest.
                // No callbacks or nested dispatch are performed during this delay.
                [NSThread sleepForTimeInterval:double(expensivePollMs)*.001];
                state->pollBlockMs=now()-begin;return nil;
            }
            if(state!=nullptr) {
                ++state->nativeDepth;
                if(state->phase==Phase::saturated)++state->saturatedPolls;
                if(state->phase==Phase::idle)++state->idlePolls;
            }
            NSEvent* event=[super nextEventMatchingMask:mask untilDate:expiration inMode:mode dequeue:dequeue];
            if(state!=nullptr)--state->nativeDepth;
            return event;
        }
        - (void)sendEvent:(NSEvent*)event {
            State* const state=active;
            const bool ours=state!=nullptr && ourEvent(event);
            if(ours) {
                state->wrongThread|=!messageThread();
                if(state->phase==Phase::saturated && event.subtype==saturatedSubtype) {
                    ++state->saturatedDeliveries;state->saturatedDeliveryMs=now()-state->saturatedStarted;
                }
                if(state->phase==Phase::modal && event.subtype==blockedSubtype)++state->blockedDeliveries;
                if(state->phase==Phase::modal && event.subtype==allowedSubtype)++state->allowedDeliveries;
            }
            [super sendEvent:event];
            if(ours && state->phase==Phase::saturated && event.subtype==saturatedSubtype)++state->saturatedSuperReturns;
            if(ours && state->phase==Phase::modal && event.subtype==allowedSubtype)++state->allowedSuperReturns;
        }
        @end

        int main(int argc,char** argv) {
            @autoreleasepool {
                if(argc!=2) {std::cerr<<"Usage: ready-source-controls result.json\n";return 2;}
                [ChimeraReadySourceApplication sharedApplication];
                juce::ScopedJuceInitialiser_GUI gui;
                auto* messages=juce::MessageManager::getInstance();
                juce::var report=object();
                put(report,"schema",1);put(report,"source_sha","781d03dd49bba51d6cfa7b1c6a0ec8d9e75a0333");
                put(report,"helper_sha256",READY_SOURCE_HELPER_SHA256);
                put(report,"purpose","Separate native control process; does not certify the CAB target");
                put(report,"interleaving_contract","FIFO within JUCE; CF/AppKit interleaving deliberately changes");
                const bool setup=messageThread() && [NSApp isMemberOfClass:[ChimeraReadySourceApplication class]]
                    && chimeraTest::dispatchFor(0);
                put(report,"setup_passed",setup);
                if(!setup)return writeReport(report,argv[1],2);
                auto state=std::make_shared<State>();state->order.fill(-1);state->firstPollOrder.fill(-1);
                active=state.get();

                // Native zero-duration semantics in a private mode with one persistent
                // source. This does not assume the historical Apple source matches macOS.
                juce::var zero=object();bool zeroPassed=false;
                {
                    CFStringRef mode=CFSTR("ChimeraReadySourceZeroSemantics");Source source(mode,3);
                    ZeroObserverState observed;
                    CFRunLoopObserverContext context{};context.info=&observed;
                    CFRunLoopObserverRef observer=CFRunLoopObserverCreate(kCFAllocatorDefault,
                        kCFRunLoopEntry|kCFRunLoopBeforeTimers|kCFRunLoopBeforeSources|kCFRunLoopBeforeWaiting|kCFRunLoopExit,
                        true,0,zeroObserver,&context);
                    juce::Array<juce::var> statuses;
                    if(source.state.source!=nullptr && observer!=nullptr) {
                        CFRunLoopAddObserver(CFRunLoopGetCurrent(),observer,mode);source.signal();
                        bool exact=true;
                        for(int i=0;i<3;++i) {
                            const auto status=CFRunLoopRunInMode(mode,0.0,true);statuses.add(int(status));
                            exact&=status==kCFRunLoopRunHandledSource && source.state.calls==i+1;
                        }
                        const auto idleStatus=CFRunLoopRunInMode(mode,0.0,true);statuses.add(int(idleStatus));
                        zeroPassed=exact && idleStatus==kCFRunLoopRunTimedOut && source.state.calls==3
                            && !source.state.wrongThread && observed.entries==4 && observed.beforeTimers==4 && observed.beforeSources==4
                            && observed.beforeWaiting==0 && observed.exits==4;
                        CFRunLoopRemoveObserver(CFRunLoopGetCurrent(),observer,mode);
                    }
                    if(observer!=nullptr) {CFRunLoopObserverInvalidate(observer);CFRelease(observer);}
                    put(zero,"statuses",statuses);put(zero,"source_calls",source.state.calls);
                    put(zero,"entry_callbacks",observed.entries);put(zero,"before_timers_callbacks",observed.beforeTimers);
                    put(zero,"before_sources_callbacks",observed.beforeSources);
                    put(zero,"before_waiting_callbacks",observed.beforeWaiting);put(zero,"exit_callbacks",observed.exits);
                    put(zero,"passed",zeroPassed);
                }
                put(report,"zero_seconds_semantics",zero);

                // Same measured workload as the earlier fairness proof: 12 FIFO JUCE
                // callbacks plus a tail fence, then one expensive native poll.
                for(int i=0;i<callbackCount;++i)state->posts+=juce::MessageManager::callAsync([state,i] {
                    state->wrongThread|=!messageThread();
                    if(state->delivered<callbackCount)state->order[size_t(state->delivered)]=i;
                    ++state->delivered;
                }) ? 1 : 0;
                state->posts+=juce::MessageManager::callAsync([state] {
                    state->wrongThread|=!messageThread();state->fence=true;state->fenceMs=now()-state->started;
                }) ? 1 : 0;
                const bool untouched=state->delivered==0 && !state->fence;
                state->started=now();state->phase=Phase::finite;
                const bool finiteContinues=chimeraTest::dispatchFor(finiteBudgetMs);
                const double finiteElapsed=now()-state->started;
                const State finiteFrozen=*state;state->phase=Phase::none;
                const bool finitePassed=untouched && finiteContinues && finiteFrozen.posts==callbackCount+1
                    && finiteFrozen.finitePolls==1 && finiteFrozen.pollBlockMs>=finiteBudgetMs
                    && finiteFrozen.firstPollDelivered==callbackCount && finiteFrozen.firstPollFence
                    && finiteFrozen.fence && finiteFrozen.fenceMs>=0 && finiteFrozen.fenceMs<=finiteBudgetMs
                    && fifo(finiteFrozen.order,finiteFrozen.delivered)
                    && fifo(finiteFrozen.firstPollOrder,finiteFrozen.firstPollDelivered) && !finiteFrozen.wrongThread;
                juce::var finite=object();put(finite,"passed",finitePassed);put(finite,"posts",finiteFrozen.posts);
                put(finite,"requested_ms",finiteBudgetMs);put(finite,"artificial_poll_ms",expensivePollMs);
                put(finite,"polls",finiteFrozen.finitePolls);put(finite,"first_poll_delivered",finiteFrozen.firstPollDelivered);
                put(finite,"first_poll_fence",finiteFrozen.firstPollFence);put(finite,"return_delivered",finiteFrozen.delivered);
                put(finite,"return_fence",finiteFrozen.fence);put(finite,"order",arrayValue(finiteFrozen.order));
                put(finite,"first_poll_order",arrayValue(finiteFrozen.firstPollOrder));put(finite,"fence_ms",finiteFrozen.fenceMs);
                put(finite,"first_poll_ms",finiteFrozen.firstPollMs);put(finite,"poll_block_ms",finiteFrozen.pollBlockMs);
                put(finite,"dispatch_elapsed_ms",finiteElapsed);put(report,"finite_fifo_before_poll",finite);

                juce::var saturated=object();bool saturatedPassed=false;
                {
                    Source source(kCFRunLoopDefaultMode,0);state->phase=Phase::saturated;state->saturatedStarted=now();
                    const bool posted=source.state.source!=nullptr && postEvent(saturatedSubtype);
                    if(posted) {
                        source.signal();
                        const bool complete=progressUntil([&] {return state->saturatedSuperReturns==1;});
                        saturatedPassed=complete && state->saturatedPolls>0 && source.state.calls>1
                            && state->saturatedDeliveries==1 && state->saturatedSuperReturns==1
                            && state->saturatedDeliveryMs>=0 && state->saturatedDeliveryMs<=deliveryLimitMs
                            && !source.state.wrongThread && !state->wrongThread;
                    }
                    put(saturated,"passed",saturatedPassed);put(saturated,"source_callbacks",source.state.calls);
                    put(saturated,"native_polls",state->saturatedPolls);put(saturated,"native_deliveries",state->saturatedDeliveries);
                    put(saturated,"native_super_returns",state->saturatedSuperReturns);
                    put(saturated,"native_delivery_ms",state->saturatedDeliveryMs);state->phase=Phase::none;
                }
                put(report,"saturated_source_native_progress",saturated);

                // Keep initialized JUCE's persistent default-mode source alive. Count
                // before-waiting callbacks outside nested AppKit polling, so a tight
                // zero-duration/native-poll loop cannot satisfy this idle-yield check.
                juce::var idle=object();bool idlePassed=false;state->phase=Phase::idle;
                CFRunLoopObserverRef observer=CFRunLoopObserverCreate(kCFAllocatorDefault,kCFRunLoopBeforeWaiting,
                    true,0,idleObserver,nullptr);
                if(observer!=nullptr) {
                    CFRunLoopAddObserver(CFRunLoopGetCurrent(),observer,kCFRunLoopDefaultMode);
                    const bool complete=progressUntil([&] {return state->idleWaits>0;});
                    idlePassed=complete && state->idlePolls>0 && state->firstIdleWaitPolls>0;
                    CFRunLoopRemoveObserver(CFRunLoopGetCurrent(),observer,kCFRunLoopDefaultMode);
                    CFRunLoopObserverInvalidate(observer);CFRelease(observer);
                }
                put(idle,"passed",idlePassed);put(idle,"native_polls",state->idlePolls);
                put(idle,"outside_native_before_waiting",state->idleWaits);
                put(idle,"polls_before_first_idle_wait",state->firstIdleWaitPolls);put(report,"idle_yield",idle);
                state->phase=Phase::none;

                // Verify the same modal-filter hook used by pinned JUCE. This controlled
                // hook blocks our one tagged event, chains other events to the old hook,
                // and is restored before the stop phase. No GUI component policy claim.
                state->phase=Phase::modal;previousModalFilter=juce::isEventBlockedByModalComps;
                juce::isEventBlockedByModalComps=modalFilter;
                const bool modalPosted=postEvent(blockedSubtype) && postEvent(allowedSubtype);
                const bool modalComplete=modalPosted && progressUntil([&] {
                    return state->blockedFilters==1 && state->allowedSuperReturns==1;
                });
                juce::isEventBlockedByModalComps=previousModalFilter;
                const bool modalPassed=modalComplete && state->blockedFilters==1 && state->blockedDeliveries==0
                    && state->allowedFilters==1 && state->allowedDeliveries==1 && state->allowedSuperReturns==1;
                juce::var modal=object();put(modal,"passed",modalPassed);put(modal,"blocked_filter_calls",state->blockedFilters);
                put(modal,"blocked_send_calls",state->blockedDeliveries);put(modal,"allowed_filter_calls",state->allowedFilters);
                put(modal,"allowed_send_calls",state->allowedDeliveries);put(modal,"allowed_super_returns",state->allowedSuperReturns);
                put(modal,"hook_restored",juce::isEventBlockedByModalComps==previousModalFilter);put(report,"modal_filter_hook",modal);

                state->phase=Phase::stop;
                const bool stopPosted=juce::MessageManager::callAsync([state] {
                    state->wrongThread|=!messageThread();state->stopCallback=true;
                    juce::MessageManager::getInstance()->stopDispatchLoop();state->stopReturned=true;
                });
                const bool stopContinues=chimeraTest::dispatchFor(sliceMs);
                const bool zeroAfterStopContinues=chimeraTest::dispatchFor(0);
                const bool stopped=messages->hasStopMessageBeenSent();
                const bool stopPassed=stopPosted && state->stopCallback && state->stopReturned && stopped
                    && !stopContinues && !zeroAfterStopContinues && !state->wrongThread;
                juce::var stop=object();put(stop,"passed",stopPassed);put(stop,"callback_called",state->stopCallback);
                put(stop,"callback_returned",state->stopReturned);put(stop,"stop_flag",stopped);
                put(stop,"dispatch_return",stopContinues);put(stop,"zero_after_stop_return",zeroAfterStopContinues);put(report,"stop",stop);
                const bool passed=zeroPassed && finitePassed && saturatedPassed && idlePassed && modalPassed && stopPassed;
                put(report,"passed",passed);put(report,"marker",passed ? "PASS_READY_SOURCE_NATIVE_CONTROLS" : "FAIL_READY_SOURCE_NATIVE_CONTROLS");
                put(report,"wrong_thread",state->wrongThread);put(report,"process_attempts",1);
                // All phase results are sealed before clearing hooks or GUI teardown.
                active=nullptr;state->phase=Phase::none;
                return writeReport(report,argv[1],passed ? 0 : 1);
            }
        }
        '''
        payloads['diagnostics/macos-ready-source/targets.cmake'] = r'''# Isolated diagnostic target; not part of the released project.
        if(NOT APPLE)
          message(FATAL_ERROR "Ready-source controls require macOS")
        endif()
        enable_language(OBJCXX)
        juce_add_console_app(ChimeraReadySourceControls PRODUCT_NAME "ChimeraReadySourceControls")
        target_sources(ChimeraReadySourceControls PRIVATE
          "${CMAKE_CURRENT_SOURCE_DIR}/diagnostics/macos-ready-source/ReadySourceControls.mm"
          "${CMAKE_CURRENT_SOURCE_DIR}/Tests/NativeMessageLoop.mm")
        target_include_directories(ChimeraReadySourceControls PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/Tests")
        target_compile_definitions(ChimeraReadySourceControls PRIVATE
          JUCE_USE_CURL=0 JUCE_WEB_BROWSER=0 JUCE_MODAL_LOOPS_PERMITTED=1
          READY_SOURCE_HELPER_SHA256="41bfbf7f9b9064ebc93e1e6f06ae6bf84f6de1394e156fc6a5d5879eb50a01d4")
        target_link_libraries(ChimeraReadySourceControls PRIVATE juce::juce_events juce::juce_core
