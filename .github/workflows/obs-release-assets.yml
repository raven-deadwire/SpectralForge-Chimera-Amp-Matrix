name: Attach OBS filter packages to v1.4.1-beta.1
# One-shot: attaches the standalone OBS filter packages built and tested by
# OBS add-on run 44147274342 (source 5bbc2715, the same OBS code as the
# v1.4.1-beta.1 release) to that release. Each file must match the SHA-256
# verified before upload; files already attached are left untouched.
on:
  push:
    branches: [claude/optimistic-wozniak-rs4b5k]
    paths: ['.github/workflows/obs-release-assets.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: obs-release-assets
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.4.1-beta.1
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 44147274342
          github-token: ${{ github.token }}
          pattern: chimera-obs-{macos-universal,linux-x86_64}-5bbc2715dfde34aa92f4312ef05d938498ad66bd
          merge-multiple: true
          path: obs
      - name: Verify the packages
        working-directory: obs
        run: |
          cat > chimera-obs-SHA256SUMS.txt <<'EOF'
          814423de083c6b3c08e032961a053f43afdf5b432647c0c6e8ab320b68286787  chimera-obs-macos-universal-5bbc2715df.zip
          6faf089e8543b77dfa616698aa7ac5f8e836c5212dfd97257a9bffb37ff020c2  chimera-obs-linux-x86_64-5bbc2715df.tar.gz
          EOF
          sha256sum -c chimera-obs-SHA256SUMS.txt
          ls -l
      - name: Attach to the release
        working-directory: obs
        run: |
          existing="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          for f in chimera-obs-macos-universal-5bbc2715df.zip chimera-obs-linux-x86_64-5bbc2715df.tar.gz chimera-obs-SHA256SUMS.txt; do
            if grep -qx "$f" <<<"$existing"; then echo "already attached: $f"; else gh release upload "$TAG" "$f"; fi
          done
          gh release view "$TAG" --json assets -q '.assets[]|select(.name|startswith("chimera-obs"))|.name+" "+(.size|tostring)+" "+.digest'
      - name: Describe the packages in the release notes
        run: |
          gh release view "$TAG" --json body -q .body > body.md
          cat > obs-section.md <<'EOF'
          **OBS filter on its own (added 2026-11-18):** the installers above already offer
          the OBS Studio filter as an optional item (on Windows it is part of the Windows
          installer). To add only the filter, use `chimera-obs-macos-universal-5bbc2715df.zip`
          (macOS 12+, Apple silicon and Intel) or `chimera-obs-linux-x86_64-5bbc2715df.tar.gz`
          (x86_64, glibc 2.38+, OBS from your distribution's packages; Flatpak and Snap are not
          supported; the editor window needs X11 or XWayland). Close OBS and run `./install.sh`
          from the unpacked folder; the Chimera VST3 must be installed. Checksums are in
          `chimera-obs-SHA256SUMS.txt`. These packages were built and tested by OBS add-on run
          44147274342 from source `5bbc2715`, whose OBS code is identical to this release. The
          macOS module is ad-hoc signed and not notarized. They are not listed in `SHA256SUMS.txt`.

          EOF
          python3 - <<'PY'
          body = open("body.md", encoding="utf-8").read().rstrip("\n")
          section = open("obs-section.md", encoding="utf-8").read()
          if "OBS filter on its own" in body:
              print("release notes already describe the OBS packages")
              raise SystemExit(0)
          anchor = "**License period:** this beta expires at"
          index = body.index(anchor)  # first occurrence: the 1.4.1-beta.1 section
          open("body-new.md", "w", encoding="utf-8").write(body[:index] + section + body[index:] + "\n")
          PY
          if [ -f body-new.md ]; then gh release edit "$TAG" --notes-file body-new.md; fi
          gh release view "$TAG" --json body -q .body | sed -n '1,30p'
